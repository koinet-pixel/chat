<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Advanced Firebase Signup</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,Helvetica,sans-serif;
    }

    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --card:#111827;
      --input:#1e293b;
      --primary:#2563eb;
      --primaryHover:#1d4ed8;
      --text:#ffffff;
      --gray:#94a3b8;
      --success:#22c55e;
      --danger:#ef4444;
      --warning:#f59e0b;
      --border:rgba(255,255,255,0.08);
    }

    body{
      background:
      linear-gradient(
        135deg,
        var(--bg1),
        var(--bg2)
      );

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;

      overflow-x:hidden;
    }

    .container{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .auth-box{

      width:100%;
      max-width:400px;

      background:var(--card);

      padding:35px;

      border-radius:18px;

      border:1px solid var(--border);

      box-shadow:
      0 10px 35px rgba(0,0,0,0.35);

      animation:fadeIn .25s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .auth-box h1{
      color:var(--text);
      text-align:center;
      margin-bottom:10px;
      font-size:32px;
    }

    .auth-box p{
      color:var(--gray);
      text-align:center;
      margin-bottom:25px;
      line-height:1.5;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .input-group{
      position:relative;
    }

    .input-group input{

      width:100%;

      padding:15px;

      border:none;

      border-radius:12px;

      background:var(--input);

      color:var(--text);

      font-size:15px;

      outline:none;

      border:1px solid transparent;

      transition:
      border-color .2s ease,
      box-shadow .2s ease;

    }

    .input-group input:focus{

      border-color:#3b82f6;

      box-shadow:
      0 0 0 3px rgba(59,130,246,0.18);

    }

    .input-group input::placeholder{
      color:#64748b;
    }

    .show-btn{

      position:absolute;

      right:14px;
      top:15px;

      background:none;

      border:none;

      color:#60a5fa;

      cursor:pointer;

      font-size:13px;

      font-weight:bold;

      user-select:none;
    }

    .strength,
    .match-text{

      margin-top:8px;

      font-size:13px;

      font-weight:bold;

      min-height:16px;

    }

    .weak{
      color:var(--danger);
    }

    .medium{
      color:var(--warning);
    }

    .strong{
      color:var(--success);
    }

    .error{
      color:var(--danger);
    }

    .success{
      color:var(--success);
    }

    .signup-btn{

      padding:15px;

      border:none;

      border-radius:12px;

      background:var(--primary);

      color:white;

      font-size:16px;

      font-weight:bold;

      cursor:pointer;

      transition:
      background .2s ease,
      transform .2s ease,
      opacity .2s ease;

      will-change:transform;
    }

    .signup-btn:hover{
      background:var(--primaryHover);
    }

    .signup-btn:active{
      transform:scale(.98);
    }

    .signup-btn.loading{
      opacity:.7;
      pointer-events:none;
    }

    .bottom-text{

      margin-top:20px;

      text-align:center;

      color:#cbd5e1;

      font-size:14px;

      line-height:1.5;
    }

    .bottom-text a{
      color:#60a5fa;
      text-decoration:none;
      font-weight:bold;
    }

    .bottom-text a:hover{
      text-decoration:underline;
    }

    #message{

      margin-top:20px;

      text-align:center;

      font-size:14px;

      font-weight:bold;

      min-height:18px;

      line-height:1.5;
    }

    @media(max-width:480px){

      body{
        padding:14px;
      }

      .auth-box{
        padding:25px;
        border-radius:16px;
      }

      .auth-box h1{
        font-size:26px;
      }

      .auth-box p{
        font-size:14px;
      }

      .input-group input{
        padding:14px;
        font-size:14px;
      }

      .signup-btn{
        padding:14px;
        font-size:15px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="auth-box">

      <h1>Create Account</h1>

      <p>
        Join the Seeker Realtime Chatting
      </p>

      <form id="signup-form">

        <!-- Username -->
        <div class="input-group">

          <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
            required
          />

        </div>

        <!-- Email -->
        <div class="input-group">

          <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
            required
          />

        </div>

        <!-- Password -->
        <div class="input-group">

          <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="new-password"
            required
          />

          <button
            type="button"
            class="show-btn"
            data-target="password"
          >
            Show
          </button>

          <div
            id="password-strength"
            class="strength"
          ></div>

        </div>

        <!-- Confirm Password -->
        <div class="input-group">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            autocomplete="new-password"
            required
          />

          <button
            type="button"
            class="show-btn"
            data-target="confirmPassword"
          >
            Show
          </button>

          <div
            id="password-match"
            class="match-text"
          ></div>

        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="signup-btn"
          id="signupBtn"
        >
          Create Account
        </button>

      </form>

      <div id="message"></div>

      <div class="bottom-text">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>

    </div>

  </div>

  <script type="module">

  // ================= FIREBASE =================

  import { auth, db }
  from "./firebase.js";

  import {

    createUserWithEmailAndPassword,
    updateProfile,
    setPersistence,
    browserLocalPersistence

  }

  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {

    doc,
    setDoc,
    serverTimestamp

  }

  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ================= ELEMENTS =================

  const signupForm =
  document.getElementById("signup-form");

  const username =
  document.getElementById("username");

  const email =
  document.getElementById("email");

  const password =
  document.getElementById("password");

  const confirmPassword =
  document.getElementById("confirmPassword");

  const signupBtn =
  document.getElementById("signupBtn");

  const message =
  document.getElementById("message");

  const passwordStrength =
  document.getElementById("password-strength");

  const passwordMatch =
  document.getElementById("password-match");

  // ================= FIREBASE PERSISTENCE =================

  try{

    await setPersistence(
      auth,
      browserLocalPersistence
    );

  }catch(error){

    console.log(error);

  }

  // ================= MESSAGE =================

  function showMessage(text,type){

    message.textContent = text;
    message.className = type;

  }

  // ================= BUTTON STATE =================

  function setLoading(state){

    signupBtn.disabled = state;

    if(state){

      signupBtn.textContent =
      "Creating Account...";

      signupBtn.classList.add(
        "loading"
      );

    }else{

      signupBtn.textContent =
      "Create Account";

      signupBtn.classList.remove(
        "loading"
      );

    }

  }

  // ================= TOGGLE PASSWORD =================

  document
  .querySelectorAll(".show-btn")
  .forEach((button)=>{

    button.addEventListener(
      "click",
      ()=>{

        const targetId =
        button.dataset.target;

        const input =
        document.getElementById(
          targetId
        );

        const hidden =
        input.type === "password";

        input.type =
        hidden
        ? "text"
        : "password";

        button.textContent =
        hidden
        ? "Hide"
        : "Show";

      }
    );

  });

  // ================= PASSWORD STRENGTH =================

  password.addEventListener(
    "input",
    ()=>{

      const value =
      password.value.trim();

      if(!value){

        passwordStrength.textContent = "";
        passwordStrength.className =
        "strength";

        return;

      }

      const hasUpper =
      /[A-Z]/.test(value);

      const hasNumber =
      /[0-9]/.test(value);

      const hasSymbol =
      /[^A-Za-z0-9]/.test(value);

      let text = "";
      let strength = "";

      if(value.length < 6){

        text = "Weak Password";
        strength = "weak";

      }else if(

        value.length >= 8 &&
        hasUpper &&
        hasNumber &&
        hasSymbol

      ){

        text = "Strong Password";
        strength = "strong";

      }else{

        text = "Medium Password";
        strength = "medium";

      }

      passwordStrength.textContent =
      text;

      passwordStrength.className =
      `strength ${strength}`;

    }
  );

  // ================= PASSWORD MATCH =================

  function validatePasswordMatch(){

    if(!confirmPassword.value){

      passwordMatch.textContent = "";
      passwordMatch.className =
      "match-text";

      return false;

    }

    const matched =
    password.value ===
    confirmPassword.value;

    passwordMatch.textContent =
    matched
    ? "Passwords Match"
    : "Passwords Do Not Match";

    passwordMatch.className =
    matched
    ? "match-text success"
    : "match-text error";

    return matched;

  }

  password.addEventListener(
    "input",
    validatePasswordMatch
  );

  confirmPassword.addEventListener(
    "input",
    validatePasswordMatch
  );

  // ================= SIGNUP =================

  signupForm.addEventListener(
    "submit",
    async(e)=>{

      e.preventDefault();

      const usernameValue =
      username.value.trim();

      const emailValue =
      email.value.trim();

      const passwordValue =
      password.value;

      const confirmValue =
      confirmPassword.value;

      // VALIDATION

      if(usernameValue.length < 3){

        showMessage(
          "Username must be at least 3 characters.",
          "error"
        );

        return;

      }

      if(passwordValue !== confirmValue){

        showMessage(
          "Passwords do not match!",
          "error"
        );

        return;

      }

      if(passwordValue.length < 6){

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;

      }

      try{

        setLoading(true);

        showMessage("", "");

        // CREATE USER

        const userCredential =
        await createUserWithEmailAndPassword(

          auth,
          emailValue,
          passwordValue

        );

        const user =
        userCredential.user;

        // UPDATE PROFILE

        await updateProfile(user,{

          displayName:
          usernameValue

        });

        // SAVE USER

        await setDoc(
          doc(db,"users",user.uid),
          {

            uid:user.uid,

            username:
            usernameValue,

            email:
            emailValue,

            online:true,

            createdAt:
            serverTimestamp()

          }
        );

        showMessage(
          "Account created successfully!",
          "success"
        );

        signupForm.reset();

        passwordStrength.textContent = "";
        passwordMatch.textContent = "";

        // FAST REDIRECT

        window.location.replace(
          "login.html"
        );

      }catch(error){

        console.log(error);

        let errorMessage =
        "Signup failed.";

        switch(error.code){

          case
          "auth/email-already-in-use":

            errorMessage =
            "Email already exists.";
            break;

          case
          "auth/invalid-email":

            errorMessage =
            "Invalid email address.";
            break;

          case
          "auth/weak-password":

            errorMessage =
            "Password is too weak.";
            break;

          case
          "auth/network-request-failed":

            errorMessage =
            "Check your internet connection.";
            break;

        }

        showMessage(
          errorMessage,
          "error"
        );

      }finally{

        setLoading(false);

      }

    }
  );

</script>

</body>
</html>
