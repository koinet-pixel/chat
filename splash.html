<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18">
<meta name="description" content="Seeker Global Chat — Connect, communicate and stay connected with people around the world.">
<title>Seeker Global Chat</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
overflow:hidden;color:#fff;background:#070b18
}
.splash{
position:relative;width:100%;height:100svh;min-height:520px;
display:flex;align-items:center;justify-content:center;overflow:hidden;
isolation:isolate;
background:
radial-gradient(circle at 50% 40%,#00d9ff22,transparent 25%),
radial-gradient(circle at 15% 85%,#8b5cf633,transparent 28%),
radial-gradient(circle at 90% 15%,#00ffa633,transparent 25%),
linear-gradient(135deg,#030712,#071426 45%,#11102b 75%,#030712)
}

/* Liquid metallic atmosphere */
.splash:before{
content:"";position:absolute;inset:-80%;z-index:-10;
background:conic-gradient(from 0deg,
#00e5ff22,#2563eb33,#8b5cf633,#ec489933,
#00ffb733,#00e5ff22);
filter:blur(70px);animation:aurora 16s linear infinite
}
.splash:after{
content:"";position:absolute;inset:0;z-index:-9;
background:
linear-gradient(#ffffff08 1px,transparent 1px),
linear-gradient(90deg,#ffffff08 1px,transparent 1px);
background-size:45px 45px;
mask-image:radial-gradient(circle,#000,transparent 75%);
animation:grid 18s linear infinite
}

/* Moving light beams */
.beam{
position:absolute;width:55vw;height:180px;z-index:-7;
background:linear-gradient(90deg,transparent,#00e5ff18,#fff3,transparent);
filter:blur(25px);transform:rotate(-28deg);
animation:beam 9s ease-in-out infinite
}
.beam.one{top:5%;left:-25%}
.beam.two{bottom:5%;right:-25%;animation-delay:-4s;transform:rotate(28deg)}

/* Glass orbs */
.orb{
position:absolute;border-radius:50%;pointer-events:none;
border:1px solid #ffffff12;backdrop-filter:blur(4px);z-index:-6
}
.o1{width:330px;height:330px;left:-140px;top:-100px;
background:radial-gradient(circle at 35% 30%,#00d9ff45,transparent 68%);
animation:float1 10s ease-in-out infinite}
.o2{width:420px;height:420px;right:-190px;bottom:-170px;
background:radial-gradient(circle at 35% 35%,#8b5cf640,transparent 68%);
animation:float2 13s ease-in-out infinite}
.o3{width:190px;height:190px;right:9%;top:12%;
background:radial-gradient(circle,#00ffb733,transparent 70%);
animation:float3 8s ease-in-out infinite}

/* Orbital glass rings */
.orbit{
position:absolute;left:50%;top:50%;
border:1px solid #ffffff12;border-radius:50%;
transform:translate(-50%,-50%);z-index:-5
}
.orbit:before,.orbit:after{
content:"";position:absolute;width:8px;height:8px;border-radius:50%;
top:50%;left:-4px;background:#00e5ff;
box-shadow:0 0 0 5px #00e5ff15,0 0 25px #00e5ffcc
}
.orbit:after{
left:auto;right:-4px;background:#00ffb7;
box-shadow:0 0 0 5px #00ffb715,0 0 25px #00ffb7aa
}
.a{width:510px;height:510px;animation:rotate 18s linear infinite}
.b{width:700px;height:700px;border-color:#8b5cf61a;animation:rotate 27s linear infinite reverse}
.c{width:900px;height:900px;border-color:#00e5ff0b;animation:rotate 38s linear infinite}

/* Stars / particles */
.p{
position:absolute;width:4px;height:4px;border-radius:50%;
background:#fff;box-shadow:0 0 14px #00e5ff;
animation:particle 6s ease-in-out infinite
}
.p:nth-of-type(1){left:8%;top:20%}.p:nth-of-type(2){left:88%;top:25%;animation-delay:-2s}
.p:nth-of-type(3){left:15%;top:75%;animation-delay:-4s}.p:nth-of-type(4){left:80%;top:78%;animation-delay:-1s}
.p:nth-of-type(5){left:93%;top:50%;animation-delay:-3s}.p:nth-of-type(6){left:6%;top:52%;animation-delay:-5s}
.p:nth-of-type(7){left:30%;top:12%;width:2px;height:2px}.p:nth-of-type(8){left:70%;top:85%;width:2px;height:2px}

/* Main glass panel */
.content{
position:relative;width:min(92%,590px);padding:28px 24px 25px;
display:flex;flex-direction:column;align-items:center;text-align:center;
border:1px solid #ffffff20;border-radius:38px;
background:linear-gradient(145deg,#ffffff12,#ffffff04);
box-shadow:
0 35px 100px #0008,
inset 0 1px #ffffff30,
inset 0 -1px #ffffff08;
backdrop-filter:blur(25px) saturate(145%);
-webkit-backdrop-filter:blur(25px) saturate(145%);
animation:panel 1.2s cubic-bezier(.22,1,.36,1)
}
.content:before{
content:"";position:absolute;inset:1px;border-radius:37px;
background:linear-gradient(125deg,#ffffff20,transparent 25%,transparent 70%,#00e5ff10);
pointer-events:none
}

/* Logo */
.logo-wrap{
position:relative;width:clamp(105px,21vw,145px);
height:clamp(105px,21vw,145px);
display:flex;align-items:center;justify-content:center;
margin-bottom:25px
}
.logo-wrap:before,.logo-wrap:after{
content:"";position:absolute;border-radius:50%;
border:1px solid #ffffff28
}
.logo-wrap:before{
inset:-12px;border-top-color:#00e5ff;
border-bottom-color:#00ffb7;animation:rotate 8s linear infinite
}
.logo-wrap:after{
inset:-22px;border-color:#8b5cf655;
border-left-color:#ec4899;animation:rotate 13s linear infinite reverse
}

/* Chrome diamond */
.logo-ring{
position:absolute;inset:0;border:1px solid #ffffff50;
border-radius:34%;transform:rotate(45deg);
background:linear-gradient(135deg,#ffffff15,transparent 45%,#00e5ff10);
box-shadow:0 0 35px #00e5ff18;
animation:ring 10s linear infinite
}
.logo-ring:before,.logo-ring:after{
content:"";position:absolute;width:9px;height:9px;border-radius:50%;
background:#00e5ff;box-shadow:0 0 0 5px #00e5ff18,0 0 25px #00e5ff
}
.logo-ring:before{top:-5px;left:50%;transform:translateX(-50%)}
.logo-ring:after{right:-5px;top:50%;transform:translateY(-50%);background:#00ffb7}

/* Metallic glass logo */
.logo{
position:relative;width:76%;height:76%;display:flex;
align-items:center;justify-content:center;border-radius:32px;
background:
linear-gradient(145deg,#ffffff35,#ffffff08 45%,#00d9ff12),
linear-gradient(135deg,#64748b55,#11182788);
border:1px solid #ffffff45;
box-shadow:
0 25px 70px #0009,
0 0 40px #00d9ff18,
inset 0 1px #ffffff80,
inset 0 -12px 30px #0005;
overflow:hidden;
animation:logo 1.3s cubic-bezier(.22,1,.36,1) both
}
.logo:before{
content:"";position:absolute;inset:-100%;
background:linear-gradient(110deg,
transparent 35%,#ffffff15 44%,#fff9 50%,#ffffff15 56%,transparent 65%);
animation:metal 2.7s linear infinite
}

/* Chat icon */
.logo-icon{position:relative;width:58%;height:58%;z-index:2}
.logo-icon:before{
content:"";position:absolute;width:72%;height:62%;left:14%;top:15%;
border-radius:18px;
background:linear-gradient(135deg,#ffffff,#8be9ff 25%,#00a8ff 60%,#6d28d9);
box-shadow:
0 10px 30px #00bfff88,
inset 0 2px 3px #fff;
animation:bubble 3s ease-in-out infinite
}
.logo-icon:after{
content:"";position:absolute;width:22%;height:22%;left:20%;bottom:13%;
background:#009ee8;clip-path:polygon(0 0,100% 0,0 100%);
transform:rotate(-8deg)
}
.dots{position:absolute;z-index:4;display:flex;gap:4px;top:39%;left:35%}
.dots span{
width:5px;height:5px;border-radius:50%;background:#fff;
box-shadow:0 0 8px #fff;animation:dots 1.25s ease-in-out infinite
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}

/* Brand */
.brand{
font-size:clamp(30px,6vw,45px);font-weight:900;
letter-spacing:-.06em;line-height:1.05;
text-shadow:0 4px 25px #0008;
opacity:0;animation:text .8s .4s forwards
}
.seeker{
background:linear-gradient(180deg,#fff,#cbd5e1 45%,#64748b);
-webkit-background-clip:text;color:transparent
}
.global{
background:linear-gradient(90deg,#00e5ff,#38bdf8,#00ffb7,#a78bfa,#ec4899,#00e5ff);
background-size:400% auto;-webkit-background-clip:text;color:transparent;
animation:gradient 4s linear infinite
}
.sub{
margin-top:9px;font-size:clamp(9px,2.5vw,12px);font-weight:800;
text-transform:uppercase;letter-spacing:.23em;color:#cbd5e1;
opacity:0;animation:text .8s .52s forwards
}
.tag{
margin-top:14px;font-size:clamp(13px,3vw,15px);
line-height:1.6;color:#94a3b8;
opacity:0;animation:text .8s .65s forwards
}
.tag b{
background:linear-gradient(90deg,#00e5ff,#00ffb7);
-webkit-background-clip:text;color:transparent
}

/* Glass feature pills */
.features{
display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
margin-top:19px;opacity:0;animation:text .8s .8s forwards
}
.feature{
display:flex;align-items:center;gap:6px;padding:7px 11px;
border-radius:100px;
background:linear-gradient(135deg,#ffffff16,#ffffff05);
border:1px solid #ffffff1c;
box-shadow:inset 0 1px #ffffff18,0 8px 25px #0003;
backdrop-filter:blur(14px);
font-size:10px;font-weight:650;color:#cbd5e1;
animation:badge 4s ease-in-out infinite
}
.feature:nth-child(2){animation-delay:.6s}
.feature:nth-child(3){animation-delay:1.2s}
.dot{
width:5px;height:5px;border-radius:50%;background:#00ffb7;
box-shadow:0 0 12px #00ffb7
}

/* Loading */
.loading{
width:min(100%,350px);margin-top:30px;
opacity:0;animation:text .8s 1s forwards
}
.load-head{display:flex;justify-content:space-between;margin-bottom:10px}
.label{
font-size:10px;font-weight:750;letter-spacing:.08em;
text-transform:uppercase;color:#94a3b8
}
.percent{font-size:11px;font-weight:900;color:#00e5ff}
.track{
height:8px;position:relative;overflow:hidden;border-radius:100px;
background:#ffffff12;border:1px solid #ffffff18;
box-shadow:inset 0 1px 4px #0008
}
.bar{
position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;
background:linear-gradient(90deg,#2563eb,#00e5ff,#00ffb7,#a78bfa,#ec4899);
background-size:400% 100%;
box-shadow:0 0 22px #00e5ff88;
animation:progress 10s cubic-bezier(.4,0,.2,1) forwards,gradient 3s linear infinite
}
.bar:after{
content:"";position:absolute;inset:0;
background:linear-gradient(90deg,transparent,#fff,transparent);
animation:progressShine 1.3s linear infinite
}
.status{
display:flex;align-items:center;justify-content:center;gap:8px;
margin-top:14px;font-size:11px;color:#64748b;min-height:20px;
opacity:0;animation:text .8s 1.1s forwards
}
.status-dot{
width:7px;height:7px;border-radius:50%;background:#00ffb7;
box-shadow:0 0 0 4px #00ffb718,0 0 16px #00ffb7;
animation:pulse 1.5s ease-in-out infinite
}
.footer{
position:absolute;bottom:max(18px,env(safe-area-inset-bottom));
left:0;right:0;text-align:center;font-size:9px;
color:#64748b;letter-spacing:.04em;
opacity:0;animation:text .8s 1.3s forwards
}
.footer b{color:#cbd5e1}

/* Animations */
@keyframes panel{from{opacity:0;transform:translateY(30px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes logo{0%{opacity:0;transform:scale(.5) rotate(-15deg)}65%{transform:scale(1.08) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes ring{to{transform:rotate(405deg)}}
@keyframes rotate{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes aurora{to{transform:rotate(360deg)}}
@keyframes grid{to{background-position:45px 45px}}
@keyframes beam{0%,100%{opacity:0;transform:translateX(-30%) rotate(-28deg)}45%,60%{opacity:1}100%{transform:translateX(130%) rotate(-28deg)}}
@keyframes text{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes metal{from{transform:translateX(-45%) rotate(15deg)}to{transform:translateX(45%) rotate(15deg)}}
@keyframes bubble{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.18)}}
@keyframes dots{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-3px);opacity:1}}
@keyframes gradient{to{background-position:400% center}}
@keyframes progress{from{width:0}to{width:100%}}
@keyframes progressShine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes float1{0%,100%{transform:translate(0)}50%{transform:translate(30px,35px)}}
@keyframes float2{0%,100%{transform:translate(0)}50%{transform:translate(-35px,-30px)}}
@keyframes float3{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
@keyframes particle{0%,100%{transform:translate(0);opacity:.2}50%{transform:translate(14px,-22px);opacity:1}}
@keyframes badge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.45}}

@media(max-width:480px){
.splash{min-height:500px}
.content{padding:22px 16px 20px;border-radius:30px;width:94%}
.logo-wrap{margin-bottom:19px}
.brand{font-size:28px}.sub{font-size:9px;letter-spacing:.18em}
.tag{margin-top:11px;font-size:13px}
.features{max-width:315px;margin-top:15px}
.feature{padding:6px 9px;font-size:9px}
.loading{width:min(84%,300px);margin-top:25px}
.footer{font-size:8px}
.orbit.c{width:620px;height:620px}
}
@media(max-height:620px){
.content{padding-top:16px;padding-bottom:15px}
.logo-wrap{width:82px;height:82px;margin-bottom:12px}
.brand{font-size:25px}.sub{margin-top:5px}
.tag{margin-top:6px;line-height:1.35}
.features{margin-top:7px}.loading{margin-top:15px}
.footer{bottom:8px}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}
.bar{width:100%}
}
</style>
</head>

<body>
<main class="splash">
<div class="beam one"></div><div class="beam two"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="orbit a"></div><div class="orbit b"></div><div class="orbit c"></div>
<i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i>
<i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i>

<section class="content">
<div class="logo-wrap">
<div class="logo-ring"></div>
<div class="logo">
<div class="logo-icon"></div>
<div class="dots"><span></span><span></span><span></span></div>
</div>
</div>

<h1 class="brand"><span class="seeker">Seeker</span> <span class="global">Global</span> Chat</h1>
<div class="sub">Connect Beyond Boundaries</div>
<p class="tag"><b>Connect.</b> Communicate. Belong.</p>

<div class="features">
<div class="feature"><i class="dot"></i>Real-time Chat</div>
<div class="feature"><i class="dot"></i>Global Connections</div>
<div class="feature"><i class="dot"></i>Secure Messaging</div>
</div>

<div class="loading">
<div class="load-head">
<span class="label" id="label">Initializing</span>
<span class="percent" id="percent">0%</span>
</div>
<div class="track"><div class="bar"></div></div>
</div>

<div class="status">
<i class="status-dot"></i><span id="status">Preparing your global connection...</span>
</div>
</section>

<footer class="footer"><b>Seeker Global Chat</b>&nbsp; · &nbsp;© 2026 All rights reserved</footer>
</main>

<script>
const D=10000,N="signup.html",P=percent,S=status,L=label,T=performance.now(),
stages=[
[0,"Initializing","Preparing your global connection..."],
[.1,"Connecting","Establishing secure communication..."],
[.22,"Authenticating","Checking secure services..."],
[.35,"Preparing","Preparing your chat environment..."],
[.49,"Synchronizing","Synchronizing your experience..."],
[.63,"Optimizing","Optimizing your connection..."],
[.76,"Securing","Applying security and preferences..."],
[.88,"Almost Ready","Almost ready to connect..."],
[.96,"Welcome","Welcome to Seeker Global Chat..."]
];
function load(t){
let p=Math.min((t-T)/D,1);P.textContent=Math.floor(p*100)+"%";
let s=stages[0];for(const x of stages)if(p>=x[0])s=x;
L.textContent=s[1];S.textContent=s[2];
if(p<1)requestAnimationFrame(load);
else{P.textContent="100%";L.textContent="Ready";S.textContent="Welcome to Seeker Global Chat";setTimeout(()=>location.replace(N),400)}
}
addEventListener("load",()=>requestAnimationFrame(load));
history.replaceState(null,"",location.href);
</script>
</body>
</html>
