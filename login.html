<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Firebase Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .auth-box{
      width:400px;
      background:#111827;
      padding:35px;
      border-radius:18px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.08);
    }

    .auth-box h1{
      color:white;
      text-align:center;
      margin-bottom:10px;
      font-size:32px;
    }

    .auth-box p{
      color:#94a3b8;
      text-align:center;
      margin-bottom:25px;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .input-group{
      position:relative;
    }

    .input-group input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#1e293b;
      color:white;
      font-size:15px;
      outline:none;
      border:1px solid transparent;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#3b82f6;
      box-shadow:0 0 10px rgba(59,130,246,0.3);
    }

    .show-btn{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:#60a5fa;
      cursor:pointer;
      font-size:14px;
      font-weight:bold;
    }

    .login-btn{
      padding:15px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#1d4ed8;
    }

    .extra-links{
      display:flex;
      justify-content:space-between;
      margin-top:-5px;
      font-size:14px;
    }

    .extra-links a{
      color:#60a5fa;
      text-decoration:none;
    }

    .bottom-text{
      margin-top:20px;
      text-align:center;
      color:#cbd5e1;
      font-size:14px;
    }

    .bottom-text a{
      color:#60a5fa;
      text-decoration:none;
    }

    #message{
      margin-top:20px;
      text-align:center;
      font-size:14px;
      font-weight:bold;
    }

    .error{
      color:#ef4444;
    }

    .success{
      color:#22c55e;
    }

    .loading{
      opacity:0.7;
      pointer-events:none;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="auth-box">

      <h1>Welcome Back</h1>
      <p>Login to continue chatting</p>

      <form id="login-form">

        <!-- Email -->
        <div class="input-group">

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

        </div>

        <!-- Password -->
        <div class="input-group">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />

          <button
            type="button"
            class="show-btn"
            onclick="togglePassword('password', this)"
          >
            Show
          </button>

        </div>

        <!-- Links -->
        <div class="extra-links">

          <a href="#" id="forgot-password">
            Forgot Password?
          </a>

        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" id="loginBtn">
          Login
        </button>

      </form>

      <!-- Message -->
      <div id="message"></div>

      <!-- Bottom -->
      <div class="bottom-text">
        Don't have an account?
        <a href="./index.html">Create Account</a>
      </div>

    </div>

  </div>
<script type="module">

  // Firebase Config File
  import { auth } from "./firebase.js";

  // Firebase Auth Imports
  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Elements
  const loginForm =
    document.getElementById("login-form");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const loginBtn =
    document.getElementById("loginBtn");

  const forgotPassword =
    document.getElementById("forgot-password");

  // Show / Hide Password
  window.togglePassword = function(inputId, button){

    const input =
      document.getElementById(inputId);

    if(input.type === "password"){

      input.type = "text";
      button.textContent = "Hide";

    }else{

      input.type = "password";
      button.textContent = "Show";

    }

  };

  // Keep User Logged In
  await setPersistence(
    auth,
    browserLocalPersistence
  );

  // Login Form
  loginForm.addEventListener("submit",
    async (e) => {

    e.preventDefault();

    // Loading State
    loginBtn.innerText = "Logging in...";
    loginBtn.classList.add("loading");

    try{

      // Firebase Login
      const userCredential =
        await signInWithEmailAndPassword(

          auth,
          email.value,
          password.value

        );

      const user = userCredential.user;

      // Success Message
      message.innerText =
        `Welcome ${user.email}`;

      message.className = "success";

      // Redirect To Chat Page
      setTimeout(() => {

        window.location.href = "chat.html";

      }, 1000);

    }catch(error){

      console.log(error);

      // Firebase Errors
      if(error.code ===
        "auth/invalid-credential"){

        message.innerText =
          "Invalid email or password.";

      }else if(error.code ===
        "auth/user-not-found"){

        message.innerText =
          "No account found.";

      }else if(error.code ===
        "auth/wrong-password"){

        message.innerText =
          "Wrong password.";

      }else if(error.code ===
        "auth/too-many-requests"){

        message.innerText =
          "Too many attempts. Try again later.";

      }else{

        message.innerText =
          error.message;

      }

      message.className = "error";

    }finally{

      loginBtn.innerText = "Login";
      loginBtn.classList.remove("loading");

    }

  });

  // Forgot Password
  forgotPassword.addEventListener("click",
    async (e) => {

    e.preventDefault();

    if(email.value === ""){

      message.innerText =
        "Enter your email first.";

      message.className = "error";

      return;

    }

    try{

      await sendPasswordResetEmail(
        auth,
        email.value
      );

      message.innerText =
        "Password reset email sent.";

      message.className = "success";

    }catch(error){

      console.log(error);

      message.innerText =
        error.message;

      message.className = "error";

    }

  });

</script>

</body>
</html>
