<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Firebase Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{

      background:
      linear-gradient(
        135deg,
        #0f172a,
        #1e293b
      );

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      padding:20px;

      overflow:hidden;

    }

    .container{

      width:100%;

      display:flex;

      justify-content:center;

      align-items:center;

    }

    .auth-box{

      width:100%;
      max-width:400px;

      background:#111827;

      padding:35px;

      border-radius:20px;

      border:1px solid
      rgba(255,255,255,0.08);

      box-shadow:
      0 10px 40px rgba(0,0,0,0.4);

      animation:fadeIn 0.4s ease;

    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(15px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .auth-box h1{

      color:white;

      text-align:center;

      margin-bottom:10px;

      font-size:32px;

    }

    .auth-box p{

      color:#94a3b8;

      text-align:center;

      margin-bottom:25px;

      font-size:15px;

    }

    form{

      display:flex;

      flex-direction:column;

      gap:18px;

    }

    .input-group{

      position:relative;

    }

    .input-group input{

      width:100%;

      padding:15px;

      border:none;

      border-radius:14px;

      background:#1e293b;

      color:white;

      font-size:15px;

      outline:none;

      border:1px solid transparent;

      transition:0.25s ease;

    }

    .input-group input:focus{

      border-color:#3b82f6;

      box-shadow:
      0 0 0 3px
      rgba(59,130,246,0.18);

    }

    .input-group input::placeholder{

      color:#94a3b8;

    }

    .show-btn{

      position:absolute;

      right:14px;

      top:50%;

      transform:translateY(-50%);

      background:none;

      border:none;

      color:#60a5fa;

      cursor:pointer;

      font-size:13px;

      font-weight:700;

    }

    .show-btn:active{
      transform:
      translateY(-50%)
      scale(0.95);
    }

    .extra-links{

      display:flex;

      justify-content:flex-end;

      margin-top:-5px;

      font-size:14px;

    }

    .extra-links a{

      color:#60a5fa;

      text-decoration:none;

      transition:0.2s;

    }

    .extra-links a:hover{

      color:#93c5fd;

    }

    .login-btn{

      padding:15px;

      border:none;

      border-radius:14px;

      background:#2563eb;

      color:white;

      font-size:16px;

      font-weight:700;

      cursor:pointer;

      transition:0.25s ease;

    }

    .login-btn:hover{

      background:#1d4ed8;

    }

    .login-btn:active{

      transform:scale(0.98);

    }

    .loading{

      opacity:0.7;

      pointer-events:none;

    }

    #message{

      min-height:22px;

      margin-top:18px;

      text-align:center;

      font-size:14px;

      font-weight:700;

    }

    .error{
      color:#ef4444;
    }

    .success{
      color:#22c55e;
    }

    .bottom-text{

      margin-top:20px;

      text-align:center;

      color:#cbd5e1;

      font-size:14px;

    }

    .bottom-text a{

      color:#60a5fa;

      text-decoration:none;

      font-weight:600;

    }

    .bottom-text a:hover{

      color:#93c5fd;

    }

    @media(max-width:480px){

      .auth-box{

        padding:25px;

      }

      .auth-box h1{

        font-size:28px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="auth-box">

      <h1>Welcome Back</h1>

      <p>
        Login to continue chatting
      </p>

      <form id="login-form">

        <!-- EMAIL -->

        <div class="input-group">

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

        </div>

        <!-- PASSWORD -->

        <div class="input-group">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="show-btn"
            id="togglePasswordBtn"
          >
            Show
          </button>

        </div>

        <!-- FORGOT PASSWORD -->

        <div class="extra-links">

          <a href="#" id="forgot-password">
            Forgot Password?
          </a>

        </div>

        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Login
        </button>

      </form>

      <!-- MESSAGE -->

      <div id="message"></div>

      <!-- BOTTOM -->

      <div class="bottom-text">

        Don't have an account?

        <a href="./index.html">
          Create Account
        </a>

      </div>

    </div>

  </div>

<script type="module">

  // FIREBASE

  import { auth }
  from "./firebase.js";

  import {

    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence

  }

  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ELEMENTS

  const loginForm =
  document.getElementById("login-form");

  const email =
  document.getElementById("email");

  const password =
  document.getElementById("password");

  const message =
  document.getElementById("message");

  const loginBtn =
  document.getElementById("loginBtn");

  const forgotPassword =
  document.getElementById("forgot-password");

  const togglePasswordBtn =
  document.getElementById("togglePasswordBtn");

  // PASSWORD TOGGLE

  togglePasswordBtn.addEventListener(
    "click",
    () => {

      const isHidden =
      password.type === "password";

      password.type =
      isHidden
      ? "text"
      : "password";

      togglePasswordBtn.textContent =
      isHidden
      ? "Hide"
      : "Show";

    }
  );

  // FAST MESSAGE FUNCTION

  function showMessage(text, type){

    message.textContent = text;
    message.className = type;

  }

  // BUTTON STATE

  function setLoading(state){

    loginBtn.disabled = state;

    if(state){

      loginBtn.innerText =
      "Logging in...";

      loginBtn.classList.add(
        "loading"
      );

    }else{

      loginBtn.innerText =
      "Login";

      loginBtn.classList.remove(
        "loading"
      );

    }

  }

  // KEEP USER LOGGED IN
  // RUN ONLY ONCE

  try{

    await setPersistence(
      auth,
      browserLocalPersistence
    );

  }catch(error){

    console.log(error);

  }

  // LOGIN

  loginForm.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();

      const userEmail =
      email.value.trim();

      const userPassword =
      password.value.trim();

      if(
        !userEmail ||
        !userPassword
      ){

        showMessage(
          "Please fill all fields.",
          "error"
        );

        return;

      }

      try{

        setLoading(true);

        showMessage("", "");

        // FAST LOGIN

        const userCredential =
        await signInWithEmailAndPassword(

          auth,
          userEmail,
          userPassword

        );

        const user =
        userCredential.user;

        showMessage(

          `Welcome ${user.email}`,

          "success"

        );

        // INSTANT REDIRECT

        window.location.replace(
          "chat.html"
        );

      }catch(error){

        console.log(error);

        let errorMessage =
        "Login failed.";

        switch(error.code){

          case
          "auth/invalid-credential":

            errorMessage =
            "Invalid email or password.";
            break;

          case
          "auth/user-not-found":

            errorMessage =
            "No account found.";
            break;

          case
          "auth/wrong-password":

            errorMessage =
            "Wrong password.";
            break;

          case
          "auth/too-many-requests":

            errorMessage =
            "Too many attempts. Try again later.";
            break;

          case
          "auth/network-request-failed":

            errorMessage =
            "Check your internet connection.";
            break;

        }

        showMessage(
          errorMessage,
          "error"
        );

      }finally{

        setLoading(false);

      }

    }
  );

  // FORGOT PASSWORD

  forgotPassword.addEventListener(
    "click",
    async (e) => {

      e.preventDefault();

      const userEmail =
      email.value.trim();

      if(!userEmail){

        showMessage(
          "Enter your email first.",
          "error"
        );

        email.focus();

        return;

      }

      try{

        await sendPasswordResetEmail(
          auth,
          userEmail
        );

        showMessage(
          "Password reset email sent.",
          "success"
        );

      }catch(error){

        console.log(error);

        showMessage(
          error.message,
          "error"
        );

      }

    }
  );

</script>

</body>
</html>
