<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Firebase Signup</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .auth-box{
      width:400px;
      background:#111827;
      padding:35px;
      border-radius:18px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.08);
    }

    .auth-box h1{
      color:white;
      text-align:center;
      margin-bottom:10px;
      font-size:32px;
    }

    .auth-box p{
      color:#94a3b8;
      text-align:center;
      margin-bottom:25px;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .input-group{
      position:relative;
    }

    .input-group input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#1e293b;
      color:white;
      font-size:15px;
      outline:none;
      border:1px solid transparent;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#3b82f6;
      box-shadow:0 0 10px rgba(59,130,246,0.3);
    }

    .show-btn{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:#60a5fa;
      cursor:pointer;
      font-size:14px;
      font-weight:bold;
    }

    .strength{
      margin-top:8px;
      font-size:13px;
    }

    .weak{
      color:#ef4444;
    }

    .medium{
      color:#f59e0b;
    }

    .strong{
      color:#22c55e;
    }

    .match-text{
      margin-top:8px;
      font-size:13px;
    }

    .error{
      color:#ef4444;
    }

    .success{
      color:#22c55e;
    }

    .signup-btn{
      padding:15px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .signup-btn:hover{
      background:#1d4ed8;
    }

    .bottom-text{
      margin-top:20px;
      text-align:center;
      color:#cbd5e1;
      font-size:14px;
    }

    .bottom-text a{
      color:#60a5fa;
      text-decoration:none;
    }

    #message{
      margin-top:20px;
      text-align:center;
      font-size:14px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="auth-box">

      <h1>Create Account</h1>
      <p>Join the Seeker Realtime Chatting</p>

      <form id="signup-form">

        <!-- Username -->
        <div class="input-group">
          <input
            type="text"
            id="username"
            placeholder="Username"
            required
          />
        </div>

        <!-- Email -->
        <div class="input-group">
          <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
          />
        </div>

        <!-- Password -->
        <div class="input-group">

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

          <button
            type="button"
            class="show-btn"
            onclick="togglePassword('password', this)"
          >
            Show
          </button>

          <div id="password-strength" class="strength"></div>

        </div>

        <!-- Confirm Password -->
        <div class="input-group">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
          />

          <button
            type="button"
            class="show-btn"
            onclick="togglePassword('confirmPassword', this)"
          >
            Show
          </button>

          <div id="password-match" class="match-text"></div>

        </div>

        <button type="submit" class="signup-btn">
          Create Account
        </button>

      </form>

      <div id="message"></div>

      <div class="bottom-text">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

  </div>

  <script type="module">

    // Firebase Imports
    import { auth, db } from "./firebase.js";

import {
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // Inputs
    const signupForm = document.getElementById("signup-form");

    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    const message = document.getElementById("message");

    const passwordStrength =
      document.getElementById("password-strength");

    const passwordMatch =
      document.getElementById("password-match");

    // Toggle Password
    window.togglePassword = function(inputId, button){

      const input = document.getElementById(inputId);

      if(input.type === "password"){

        input.type = "text";
        button.textContent = "Hide";

      }else{

        input.type = "password";
        button.textContent = "Show";

      }

    };

    // Password Strength Checker
    password.addEventListener("input", () => {

      const value = password.value;

      let strength = "";

      if(value.length < 6){

        strength = "Weak Password";
        passwordStrength.className = "strength weak";

      }else if(
        value.match(/[A-Z]/) &&
        value.match(/[0-9]/) &&
        value.length >= 8
      ){

        strength = "Strong Password";
        passwordStrength.className = "strength strong";

      }else{

        strength = "Medium Password";
        passwordStrength.className = "strength medium";

      }

      passwordStrength.textContent = strength;

    });

    // Confirm Password Match
    confirmPassword.addEventListener("input", () => {

      if(confirmPassword.value === ""){

        passwordMatch.textContent = "";
        return;

      }

      if(password.value === confirmPassword.value){

        passwordMatch.textContent = "Passwords Match";
        passwordMatch.className = "match-text success";

      }else{

        passwordMatch.textContent = "Passwords Do Not Match";
        passwordMatch.className = "match-text error";

      }

    });

    // Signup Form
    signupForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      // Check Password Match
      if(password.value !== confirmPassword.value){

        message.innerText = "Passwords do not match!";
        message.className = "error";
        return;

      }

      // Password Length
      if(password.value.length < 6){

        message.innerText =
          "Password must be at least 6 characters.";

        message.className = "error";
        return;

      }

      try{

        // Create Firebase User
        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email.value,
            password.value
          );

        const user = userCredential.user;

        // Update Firebase Auth Profile
        await updateProfile(user, {
          displayName: username.value
        });

        // Save User Data to Firestore
        await setDoc(doc(db, "users", user.uid), {

          uid: user.uid,
          username: username.value,
          email: email.value,
          createdAt: serverTimestamp()

        });

        message.innerText =
          "Account created successfully!";

        message.className = "success";

        // Reset Form
        signupForm.reset();

        passwordStrength.textContent = "";
        passwordMatch.textContent = "";

        // Redirect
        setTimeout(() => {

          window.location.href = "login.html";

        }, 2000);

      }catch(error){

        console.log(error);

        if(error.code === "auth/email-already-in-use"){

          message.innerText =
            "Email already exists.";

        }else if(error.code === "auth/invalid-email"){

          message.innerText =
            "Invalid email address.";

        }else if(error.code === "auth/weak-password"){

          message.innerText =
            "Password is too weak.";

        }else{

          message.innerText = error.message;

        }

        message.className = "error";

      }

    });

  </script>

</body>
</html>
