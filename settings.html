<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Advanced Chat Settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

:root{

    --primary-white:#F8FBFF;
    --secondary-white:#EEF4FF;

    --blue:#4F8CFF;
    --blue-light:#DCE8FF;

    --text:#0F172A;
    --text-light:#64748B;

    --glass:rgba(255,255,255,0.55);

    --shadow-light:rgba(255,255,255,0.9);
    --shadow-dark:rgba(15,23,42,0.08);

}

body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #F8FBFF,
    #EEF4FF
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

    overflow-x:hidden;
}

.settings-container{

    width:100%;
    max-width:420px;

    background:var(--glass);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.35);

    border-radius:35px;

    padding:28px;

    box-shadow:
    0 10px 40px rgba(79,140,255,0.12),
    0 4px 15px rgba(0,0,0,0.05);

    position:relative;

    overflow:hidden;
}

/* decorative blur */

.settings-container::before{

    content:"";

    position:absolute;

    width:250px;
    height:250px;

    background:rgba(79,140,255,0.15);

    border-radius:50%;

    top:-120px;
    right:-120px;

    filter:blur(40px);
}

.top-bar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:30px;
}

.top-bar h1{

    font-size:28px;
    font-weight:700;

    color:var(--text);

    letter-spacing:-1px;
}

.profile-card{

    background:rgba(255,255,255,0.45);

    border-radius:28px;

    padding:22px;

    display:flex;
    align-items:center;
    gap:18px;

    backdrop-filter:blur(15px);

    box-shadow:
    8px 8px 20px rgba(0,0,0,0.05),
    -8px -8px 20px rgba(255,255,255,0.7);

    margin-bottom:25px;
}

.profile-card img{

    width:80px;
    height:80px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid rgba(255,255,255,0.7);

    box-shadow:0 5px 15px rgba(79,140,255,0.2);
}

.profile-info h2{

    font-size:20px;
    color:var(--text);
    font-weight:700;
}

.profile-info p{

    font-size:14px;
    color:var(--text-light);

    margin-top:5px;
}

.section-title{

    margin:25px 0 15px;

    font-size:14px;
    font-weight:700;

    color:var(--text-light);

    text-transform:uppercase;

    letter-spacing:1px;
}

.setting-item{

    background:rgba(255,255,255,0.45);

    backdrop-filter:blur(15px);

    border-radius:22px;

    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;

    transition:0.3s ease;

    box-shadow:
    5px 5px 12px rgba(0,0,0,0.05),
    -5px -5px 12px rgba(255,255,255,0.7);
}

.setting-item:hover{

    transform:translateY(-3px);

    box-shadow:
    0 12px 25px rgba(79,140,255,0.12);
}

.setting-left{

    display:flex;
    align-items:center;
    gap:15px;
}

.icon{

    width:45px;
    height:45px;

    border-radius:15px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
    135deg,
    #ffffff,
    #dce8ff
    );

    box-shadow:
    4px 4px 10px rgba(0,0,0,0.05),
    -4px -4px 10px rgba(255,255,255,0.8);

    font-size:20px;
}

.setting-text h3{

    font-size:16px;
    color:var(--text);

    font-weight:600;
}

.setting-text p{

    font-size:13px;
    color:var(--text-light);

    margin-top:2px;
}

/* toggle */

.toggle{

    width:55px;
    height:30px;

    background:#dbeafe;

    border-radius:50px;

    position:relative;

    cursor:pointer;

    transition:0.3s ease;
}

.toggle::before{

    content:"";

    position:absolute;

    width:24px;
    height:24px;

    background:white;

    border-radius:50%;

    top:3px;
    left:4px;

    transition:0.3s ease;

    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.toggle.active{

    background:var(--blue);
}

.toggle.active::before{

    transform:translateX(24px);
}

/* buttons */

.action-btn{

    width:100%;

    padding:17px;

    border:none;

    border-radius:20px;

    font-size:15px;
    font-weight:600;

    cursor:pointer;

    margin-top:12px;

    transition:0.3s ease;
}

.password-btn{

    background:linear-gradient(
    135deg,
    #ffffff,
    #dce8ff
    );

    color:var(--text);

    box-shadow:
    5px 5px 12px rgba(0,0,0,0.05),
    -5px -5px 12px rgba(255,255,255,0.8);
}

.password-btn:hover{

    transform:scale(1.02);
}

.logout-btn{

    background:linear-gradient(
    135deg,
    #4F8CFF,
    #7AA8FF
    );

    color:white;

    box-shadow:
    0 10px 20px rgba(79,140,255,0.25);
}

.logout-btn:hover{

    transform:scale(1.02);

    box-shadow:
    0 15px 25px rgba(79,140,255,0.35);
}

/* dark mode */

.dark-mode{

    background:
    linear-gradient(
    135deg,
    #0F172A,
    #1E293B
    );
}

.dark-mode .settings-container{

    background:rgba(15,23,42,0.55);

    border:1px solid rgba(255,255,255,0.08);
}

.dark-mode .top-bar h1,
.dark-mode .setting-text h3,
.dark-mode .profile-info h2{

    color:white;
}

.dark-mode .profile-info p,
.dark-mode .setting-text p,
.dark-mode .section-title{

    color:#CBD5E1;
}

.dark-mode .setting-item,
.dark-mode .profile-card{

    background:rgba(30,41,59,0.45);
}

.dark-mode .icon{

    background:linear-gradient(
    135deg,
    #1E293B,
    #334155
    );

    color:white;
}

.dark-mode .password-btn{

    background:#1E293B;

    color:white;
}

</style>
</head>
<body>

<div class="settings-container">

    <div class="top-bar">
        <h1>Settings</h1>
    </div>

    <!-- PROFILE -->

    <div class="profile-card">

        <img src="https://i.pravatar.cc/300" alt="profile">

        <div class="profile-info">
            <h2>Karl Johnson</h2>
            <p>Building the future 🚀</p>
            <p>karl@gmail.com</p>
        </div>

    </div>

    <!-- SETTINGS -->

    <div class="section-title">
        Preferences
    </div>

    <!-- DARK MODE -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="icon">
                🌙
            </div>

            <div class="setting-text">
                <h3>Dark Mode</h3>
                <p>Switch appearance</p>
            </div>

        </div>

        <div class="toggle" id="darkToggle"></div>

    </div>

    <!-- NOTIFICATIONS -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="icon">
                🔔
            </div>

            <div class="setting-text">
                <h3>Notifications</h3>
                <p>Message alerts enabled</p>
            </div>

        </div>

        <div class="toggle active"></div>

    </div>

    <!-- ONLINE STATUS -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="icon">
                🟢
            </div>

            <div class="setting-text">
                <h3>Online Status</h3>
                <p>Visible to contacts</p>
            </div>

        </div>

        <div class="toggle active"></div>

    </div>

    <!-- LAST SEEN -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="icon">
                ⏰
            </div>

            <div class="setting-text">
                <h3>Last Seen</h3>
                <p>Show activity time</p>
            </div>

        </div>

        <div class="toggle"></div>

    </div>

    <!-- BUTTONS -->

    <button class="action-btn password-btn">
        Change Password
    </button>

    <button class="action-btn logout-btn">
        Logout
    </button>

</div>

<script>

const darkToggle = document.getElementById("darkToggle");

darkToggle.addEventListener("click",()=>{

    darkToggle.classList.toggle("active");

    document.body.classList.toggle("dark-mode");

});

const toggles = document.querySelectorAll(".toggle");

toggles.forEach(toggle=>{

    toggle.addEventListener("click",()=>{

        toggle.classList.toggle("active");

    });

});

</script>

</body>
</html>
