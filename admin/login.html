<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Secure administrator login for Isaack Shapashina Portfolio Management."
    >

    <title>Admin Login | Isaack Shapashina</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         LOGIN CSS
         
         IMPORTANT:
         If login.html and login.css are inside the same
         admin folder, use:
         
         login.css
         
         NOT:
         
         ../admin/login.css
    ====================================================== -->

    <link rel="stylesheet" href="login.css">


</head>


<body>


    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <div class="login-page">


        <!-- =================================================
             BACKGROUND ORBS
        ================================================== -->

        <div class="login-bg-orbs">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- =================================================
             LOGIN CONTAINER
        ================================================== -->

        <main class="login-container">


            <!-- =============================================
                 LOGIN CARD
            ============================================== -->

            <section class="login-card">


                <!-- =========================================
                     BRAND
                ========================================== -->

                <div class="login-brand">


                    <div class="login-logo">

                        <i class="fa-solid fa-microchip"></i>

                    </div>


                    <div>

                        <h1>
                            Isaack Admin
                        </h1>

                        <p>
                            Portfolio Management
                        </p>

                    </div>


                </div>


                <!-- =========================================
                     HEADING
                ========================================== -->

                <div class="login-heading">


                    <span class="eyebrow">

                        <i class="fa-solid fa-lock"></i>

                        Secure Area

                    </span>


                    <h2>
                        Welcome back
                    </h2>


                    <p>
                        Sign in to manage your portfolio,
                        contact information and messages.
                    </p>


                </div>


                <!-- =========================================
                     LOGIN FORM
                ========================================== -->

                <form
                    id="loginForm"
                    class="login-form"
                    novalidate
                >


                    <!-- =====================================
                         EMAIL
                    ====================================== -->

                    <div class="field">


                        <label for="email">
                            Email Address
                        </label>


                        <div class="input-wrap">


                            <i class="fa-solid fa-envelope"></i>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="admin@example.com"
                                autocomplete="email"
                                required
                            >


                        </div>


                    </div>


                    <!-- =====================================
                         PASSWORD
                    ====================================== -->

                    <div class="field">


                        <label for="password">
                            Password
                        </label>


                        <div class="input-wrap">


                            <i class="fa-solid fa-lock"></i>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >

                                <i class="fa-solid fa-eye"></i>

                            </button>


                        </div>


                    </div>


                    <!-- =====================================
                         REMEMBER ME
                    ====================================== -->

                    <div class="login-options">


                        <label class="remember">


                            <input
                                type="checkbox"
                                id="rememberMe"
                            >


                            <span>
                                Keep me signed in
                            </span>


                        </label>


                    </div>


                    <!-- =====================================
                         LOGIN BUTTON
                    ====================================== -->

                    <button
                        type="submit"
                        class="login-btn"
                        id="loginBtn"
                    >


                        <span id="loginBtnText">
                            Sign In
                        </span>


                        <i
                            class="fa-solid fa-arrow-right"
                            id="loginBtnIcon"
                        ></i>


                        <span
                            class="spinner"
                            id="loginSpinner"
                            hidden
                        ></span>


                    </button>


                    <!-- =====================================
                         ERROR MESSAGE
                    ====================================== -->

                    <div
                        class="login-error"
                        id="loginError"
                        role="alert"
                        hidden
                    >


                        <i class="fa-solid fa-circle-exclamation"></i>


                        <span id="loginErrorText">
                            Invalid login details.
                        </span>


                    </div>


                </form>


                <!-- =========================================
                     FOOTER
                ========================================== -->

                <div class="login-footer">


                    <a href="../index.html">

                        <i class="fa-solid fa-arrow-left"></i>

                        Back to portfolio

                    </a>


                    <span>
                        © 2026 Isaack Shapashina
                    </span>


                </div>


            </section>


        </main>


    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="login.js"
    ></script>


</body>

</html>
