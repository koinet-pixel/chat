<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard Redirect</title>

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="../admin.css" />

  <!-- GOOGLE FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      width:100%;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
      linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
      );
      overflow:hidden;
      position:relative;
      color:white;
    }

    /* BACKGROUND GLOW */

    .bg-glow{
      position:absolute;
      width:400px;
      height:400px;
      border-radius:50%;
      filter:blur(90px);
      opacity:.25;
      animation:float 6s ease-in-out infinite;
    }

    .glow1{
      background:#3b82f6;
      top:-100px;
      left:-100px;
    }

    .glow2{
      background:#8b5cf6;
      bottom:-100px;
      right:-100px;
      animation-delay:2s;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-25px);
      }
    }

    /* CARD */

    .redirect-card{
      position:relative;
      z-index:2;
      width:90%;
      max-width:420px;
      padding:40px 30px;
      border-radius:28px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(20px);
      text-align:center;
      box-shadow:
      0 10px 40px rgba(0,0,0,0.35);
    }

    .logo{
      width:90px;
      height:90px;
      margin:0 auto 25px;
      border-radius:24px;
      background:
      linear-gradient(
        135deg,
        #3b82f6,
        #8b5cf6
      );
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      font-weight:800;
      box-shadow:
      0 10px 30px rgba(59,130,246,0.4);
    }

    h1{
      font-size:28px;
      font-weight:800;
      margin-bottom:10px;
    }

    p{
      color:rgba(255,255,255,0.75);
      line-height:1.6;
      margin-bottom:28px;
      font-size:15px;
    }

    /* LOADER */

    .loader{
      width:65px;
      height:65px;
      border-radius:50%;
      margin:0 auto 25px;
      border:5px solid rgba(255,255,255,0.12);
      border-top:5px solid #3b82f6;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    /* STATUS */

    .status{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 18px;
      border-radius:14px;
      background:rgba(255,255,255,0.08);
      font-size:14px;
      font-weight:600;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 12px #22c55e;
      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        opacity:1;
      }
      50%{
        transform:scale(1.4);
        opacity:.6;
      }
      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    /* BUTTON */

    .btn{
      margin-top:28px;
      width:100%;
      padding:15px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-size:15px;
      font-weight:700;
      color:white;
      background:
      linear-gradient(
        135deg,
        #3b82f6,
        #8b5cf6
      );
      transition:.3s;
      box-shadow:
      0 8px 25px rgba(59,130,246,0.35);
    }

    .btn:hover{
      transform:translateY(-2px);
      opacity:.95;
    }

    .footer{
      margin-top:20px;
      font-size:13px;
      color:rgba(255,255,255,0.5);
    }

    @media(max-width:500px){

      .redirect-card{
        padding:35px 22px;
      }

      h1{
        font-size:24px;
      }

    }

  </style>
</head>
<body>

  <!-- BACKGROUND -->
  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <!-- CARD -->
  <div class="redirect-card">

    <div class="logo">
      💬
    </div>

    <div class="loader"></div>

    <h1>Opening Dashboard</h1>

    <p>
      Connecting securely to your chat admin panel.
      Please wait while we redirect you.
    </p>

    <div class="status">
      <div class="dot"></div>
      Secure Connection Active
    </div>

    <button class="btn" id="manualRedirect">
      Open Dashboard Now
    </button>

    <div class="footer">
      Advanced Chat Admin System
    </div>

  </div>

  <script>

    // REDIRECT FUNCTION

    function redirectToDashboard(){

      window.location.replace("../admin.html");

    }

    // AUTO REDIRECT

    setTimeout(() => {

      redirectToDashboard();

    }, 2500);

    // MANUAL BUTTON

    document
    .getElementById("manualRedirect")
    .addEventListener("click", () => {

      redirectToDashboard();

    });

    // OPTIONAL:
    // CHECK IF USER COMES BACK

    window.addEventListener("pageshow", () => {

      console.log("Dashboard redirect page loaded");

    });

  </script>

</body>
</html>
