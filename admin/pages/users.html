<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Users Management</title>

  <link rel="stylesheet" href="../admin.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      background:linear-gradient(135deg,#dfe9f3,#c7d8ee,#d8ede4);
      min-height:100vh;
      color:#0f172a;
    }

    /* DASHBOARD LAYOUT (MATCHED) */
    .dashboard{
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR (EXACT MATCH WITH YOUR MAIN DESIGN) */
    .sidebar{
      width:260px;
      background:rgba(255,255,255,0.6);
      backdrop-filter:blur(14px);
      border-right:1px solid rgba(148,163,184,0.2);
      padding:25px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-size:28px;
      font-weight:800;
      color:#3b82f6;
      margin-bottom:40px;
    }

    nav{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    nav a{
      text-decoration:none;
      padding:14px;
      border-radius:14px;
      color:#0f172a;
      background:rgba(255,255,255,0.6);
      transition:0.3s;
      font-weight:600;
    }

    nav a:hover{
      background:#3b82f6;
      color:white;
    }

    nav a.active{
      background:#3b82f6;
      color:white;
    }

    #logoutBtn{
      margin-top:30px;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#ef4444;
      color:white;
      font-weight:700;
      cursor:pointer;
    }

    /* MAIN CONTENT */
    .main-content{
      flex:1;
      padding:30px;
    }

    /* HEADER */
    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
      margin-bottom:30px;
    }

    .title-section h1{
      font-size:32px;
      font-weight:800;
    }

    .title-section p{
      color:#475569;
    }

    /* STATS */
    .stats{
      display:flex;
      gap:15px;
    }

    .stat-card{
      background:rgba(255,255,255,0.65);
      backdrop-filter:blur(12px);
      padding:18px;
      border-radius:24px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
      min-width:140px;
    }

    .stat-card h2{
      font-size:28px;
      color:#3b82f6;
    }

    .stat-card span{
      color:#475569;
      font-size:13px;
    }

    /* SEARCH */
    .search-box input{
      width:100%;
      padding:16px;
      border-radius:14px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.65);
      margin-bottom:25px;
      backdrop-filter:blur(12px);
    }

    /* USERS GRID */
    .users-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
    }

    /* USER CARD */
    .user-card{
      background:rgba(255,255,255,0.65);
      backdrop-filter:blur(12px);
      padding:20px;
      border-radius:24px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
    }

    .avatar{
      width:55px;
      height:55px;
      border-radius:50%;
      background:linear-gradient(135deg,#3b82f6,#8b5cf6);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      color:white;
    }

    .status{
      font-size:12px;
      padding:6px 10px;
      border-radius:20px;
      font-weight:600;
    }

    .online{
      background:rgba(34,197,94,0.15);
      color:#22c55e;
    }

    .offline{
      background:rgba(239,68,68,0.15);
      color:#ef4444;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:15px;
    }

    .btn{
      flex:1;
      padding:10px;
      border:none;
      border-radius:12px;
      color:white;
      cursor:pointer;
      font-weight:600;
    }

    .message-btn{background:#3b82f6;}
    .delete-btn{background:#ef4444;}

    /* RESPONSIVE */
    @media(max-width:900px){
      .dashboard{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }
    }

  </style>
</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR (NOW MATCHES YOUR MAIN DASHBOARD EXACTLY) -->
  <aside class="sidebar">

    <div class="logo">Chat Admin</div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a class="active" href="users.html">Users</a>
      <a href="messages.html">Messages</a>
      <a href="settings.html">Settings</a>
    </nav>

    <button id="logoutBtn">Logout</button>

  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <div class="top-bar">

      <div class="title-section">
        <h1>Users Management</h1>
        <p>Manage all registered users in real-time</p>
      </div>

      <div class="stats">
        <div class="stat-card">
          <h2 id="totalUsers">0</h2>
          <span>Total Users</span>
        </div>

        <div class="stat-card">
          <h2 id="onlineUsers">0</h2>
          <span>Online Users</span>
        </div>
      </div>

    </div>

    <div class="search-box">
      <input id="searchInput" placeholder="Search users..." />
    </div>

    <div class="users-grid" id="usersList"></div>

  </main>

</div>

<script type="module">

  import { db } from '../firebase.js';
  import { collection, onSnapshot, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const usersList = document.getElementById("usersList");
  const totalUsers = document.getElementById("totalUsers");
  const onlineUsers = document.getElementById("onlineUsers");
  const searchInput = document.getElementById("searchInput");

  let cache = [];

  function render(list){

    usersList.innerHTML = "";

    list.forEach(d=>{

      const u = d.data();
      const id = d.id;
      const letter = (u.username || "?")[0];

      usersList.innerHTML += `
        <div class="user-card">

          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="avatar">${letter}</div>
            <div class="status ${u.online ? 'online':'offline'}">
              ${u.online ? 'Online':'Offline'}
            </div>
          </div>

          <h3 style="margin-top:10px;">${u.username || 'Unknown'}</h3>
          <p style="color:#475569;">${u.email || ''}</p>

          <div class="actions">
            <button class="btn message-btn">Message</button>
            <button class="btn delete-btn" onclick="deleteUser('${id}')">Delete</button>
          </div>

        </div>
      `;
    });
  }

  window.deleteUser = async(id)=>{
    await deleteDoc(doc(db,"users",id));
  };

  onSnapshot(collection(db,"users"),snap=>{
    cache = snap.docs;

    let online = 0;
    snap.forEach(d=>{ if(d.data().online) online++; });

    totalUsers.textContent = snap.size;
    onlineUsers.textContent = online;

    render(cache);
  });

  searchInput.addEventListener("input",()=>{

    const v = searchInput.value.toLowerCase();

    render(cache.filter(d=>{
      const u = d.data();
      return u.username?.toLowerCase().includes(v) ||
             u.email?.toLowerCase().includes(v);
    }));

  });

</script>

</body>
</html>
