<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Settings</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      background:linear-gradient(135deg,#dfe9f3,#c7d8ee,#d8ede4);
      min-height:100vh;
      color:#0f172a;
    }

    /* ===== DASHBOARD LAYOUT ===== */
.dashboard{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(14px);
  border-right:1px solid rgba(148,163,184,0.2);
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo{
  font-size:28px;
  font-weight:800;
  color:#3b82f6;
  margin-bottom:40px;
}

nav{
  display:flex;
  flex-direction:column;
  gap:14px;
}

nav a{
  text-decoration:none;
  padding:14px;
  border-radius:14px;
  color:#0f172a;
  background:rgba(255,255,255,0.6);
  transition:0.3s;
  font-weight:600;
}

nav a:hover{
  background:#3b82f6;
  color:white;
}

    #logoutBtn{
      margin-top:30px;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#ef4444;
      color:white;
      font-weight:700;
      cursor:pointer;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content{
      flex:1;
      padding:30px;
    }

    h1{
      font-size:32px;
      margin-bottom:25px;
      font-weight:800;
    }

    /* ===== PANEL (GLASS STYLE MATCH) ===== */
    .panel{
      background:rgba(255,255,255,0.65);
      backdrop-filter:blur(12px);
      border-radius:24px;
      padding:25px;
      max-width:900px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
    }

    .section{
      margin-bottom:25px;
    }

    .section h3{
      margin-bottom:15px;
      font-size:18px;
      color:#334155;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid rgba(148,163,184,0.2);
    }

    .row:last-child{
      border:none;
    }

    .label{
      font-size:15px;
      color:#334155;
      font-weight:600;
    }

    /* ===== SWITCH ===== */
    .switch{
      position:relative;
      width:50px;
      height:26px;
    }

    .switch input{
      display:none;
    }

    .slider{
      position:absolute;
      cursor:pointer;
      top:0;
      left:0;
      right:0;
      bottom:0;
      background:#cbd5e1;
      border-radius:30px;
      transition:.3s;
    }

    .slider:before{
      content:"";
      position:absolute;
      height:20px;
      width:20px;
      left:3px;
      bottom:3px;
      background:white;
      border-radius:50%;
      transition:.3s;
    }

    input:checked + .slider{
      background:#3b82f6;
    }

    input:checked + .slider:before{
      transform:translateX(24px);
    }

    /* ===== BUTTON ===== */
    .btn{
      width:100%;
      padding:14px;
      margin-top:20px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      font-weight:700;
      color:white;
      background:linear-gradient(135deg,#3b82f6,#2563eb);
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width:900px){

      .dashboard{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }

    }

  </style>
</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR (UPDATED NAVIGATION) -->
  <aside class="sidebar">

    <div>
      <div class="logo">Chat Admin</div>

      <nav>
        <a href="../pages/dashboard.html">Dashboard</a>
        <a href="../pages/users.html">Users</a>
        <a href="../pages/messages.html">Messages</a>
        <a class="active" href="../pages/settings.html">Settings</a>
      </nav>
    </div>

    <button id="logoutBtn">Logout</button>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <h1>Settings</h1>

    <div class="panel">

      <div class="section">
        <h3>Appearance</h3>

        <div class="row">
          <span class="label">Dark Mode</span>
          <label class="switch">
            <input type="checkbox" id="darkMode">
            <span class="slider"></span>
          </label>
        </div>

      </div>

      <div class="section">
        <h3>Chat Settings</h3>

        <div class="row">
          <span class="label">Sound Notifications</span>
          <label class="switch">
            <input type="checkbox" id="sound">
            <span class="slider"></span>
          </label>
        </div>

        <div class="row">
          <span class="label">Auto Scroll Messages</span>
          <label class="switch">
            <input type="checkbox" id="scroll">
            <span class="slider"></span>
          </label>
        </div>

        <div class="row">
          <span class="label">Show Online Status</span>
          <label class="switch">
            <input type="checkbox" id="online">
            <span class="slider"></span>
          </label>
        </div>

      </div>

      <div class="section">
        <h3>Security</h3>

        <div class="row">
          <span class="label">Enable Admin Lock</span>
          <label class="switch">
            <input type="checkbox" id="lock">
            <span class="slider"></span>
          </label>
        </div>

      </div>

      <button class="btn" id="saveBtn">
        Save Settings
      </button>

    </div>

  </main>

</div>

<script>

const darkMode = document.getElementById("darkMode");
const sound = document.getElementById("sound");
const scroll = document.getElementById("scroll");
const online = document.getElementById("online");
const lock = document.getElementById("lock");
const saveBtn = document.getElementById("saveBtn");

function loadSettings(){

  const settings = JSON.parse(localStorage.getItem("chatSettings")) || {};

  darkMode.checked = settings.darkMode || false;
  sound.checked = settings.sound || false;
  scroll.checked = settings.scroll ?? true;
  online.checked = settings.online ?? true;
  lock.checked = settings.lock || false;

}

saveBtn.addEventListener("click",()=>{

  const settings = {
    darkMode:darkMode.checked,
    sound:sound.checked,
    scroll:scroll.checked,
    online:online.checked,
    lock:lock.checked
  };

  localStorage.setItem("chatSettings", JSON.stringify(settings));

  alert("Settings saved successfully!");

});

loadSettings();

</script>

</body>
</html>
