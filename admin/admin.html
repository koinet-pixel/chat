<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css" />
</head>


<body>

<div class="dashboard">

  <aside class="sidebar">

    <div class="logo">Chat Admin</div>

    <nav>
      <a href="pages/dashboard.html">Dashboard</a>
      <a href="pages/users.html">Users</a>
      <a href="pages/messages.html">Messages</a>
      <a href="pages/settings.html">Settings</a>
    </nav>

    <button id="logoutBtn">Logout</button>

  </aside>

  <main class="main-content">

    <header class="topbar">
      <h1>Dashboard Overview</h1>
    </header>

    <section class="cards">

      <div class="card">
        <h2 id="totalUsers">0</h2>
        <p>Total Users</p>
      </div>

      <div class="card">
        <h2 id="onlineUsers">0</h2>
        <p>Online Users</p>
      </div>

      <div class="card">
        <h2 id="totalMessages">0</h2>
        <p>Total Messages</p>
      </div>

    </section>

    <section class="live-section">

      <div class="panel">
        <h3>Recent Users</h3>
        <div id="recentUsers"></div>
      </div>

      <div class="panel">
        <h3>Recent Messages</h3>
        <div id="recentMessages"></div>
      </div>

    </section>

  </main>

</div>

<script src="./admin.js"></script>
</body>
</html>
