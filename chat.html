<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Firebase Chat App</title>

  <style>


@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
}

:root{

  --bg:
  linear-gradient(
    135deg,
    #dfe9f3,
    #c7d8ee,
    #d8ede4
  );

  --sidebar:
  rgba(240,248,255,0.72);

  --card:
  rgba(255,255,255,0.60);

  --primary:#3b82f6;

  --primary-hover:#2563eb;

  --secondary:#10b981;

  --text:#0f172a;

  --gray:#475569;

  --danger:#ef4444;

  --success:#16a34a;

  --border:
  rgba(148,163,184,0.22);

  --shadow:
  0 10px 30px rgba(15,23,42,0.10);

  --blur:blur(14px);

}

body{

  background:var(--bg);

  color:var(--text);

  height:100vh;

  overflow:hidden;

  position:relative;

}

/* ================= BACKGROUND EFFECTS ================= */

body::before{

  content:"";

  position:fixed;

  width:450px;
  height:450px;

  border-radius:50%;

  background:
  rgba(59,130,246,0.12);

  top:-160px;
  right:-160px;

  filter:blur(90px);

  z-index:-1;
}

body::after{

  content:"";

  position:fixed;

  width:420px;
  height:420px;

  border-radius:50%;

  background:
  rgba(16,185,129,0.10);

  bottom:-160px;
  left:-140px;

  filter:blur(90px);

  z-index:-1;
}

.chat-app{
  display:flex;
  width:100%;
  height:100dvh;
  overflow:hidden;
}
/* ================= MOBILE MENU ================= */

.mobile-menu-btn{

  display:none;

  position:fixed;

  top:18px;
  left:18px;

  z-index:999;

  width:48px;
  height:48px;

  border:none;

  border-radius:16px;

  background:
  rgba(255,255,255,0.82);

  backdrop-filter:var(--blur);

  border:1px solid var(--border);

  color:var(--primary);

  font-size:22px;

  cursor:pointer;

  box-shadow:var(--shadow);

}

/* ================= SIDEBAR ================= */

.sidebar{

  width:340px;

  background:
  rgba(240,248,255,0.66);

  backdrop-filter:var(--blur);

  border-right:1px solid rgba(148,163,184,0.18);

  display:flex;

  flex-direction:column;

  transition:0.35s ease;

  box-shadow:
  0 10px 35px rgba(15,23,42,0.08);

}

.sidebar.active{

  left:0;

}

.sidebar-header{

  padding:24px 22px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  border-bottom:1px solid rgba(148,163,184,0.12);

}

.logo{

  font-size:28px;

  font-weight:800;

  letter-spacing:-1px;

  color:var(--primary);

}

.logout-btn{

  padding:12px 16px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #fb7185,
    #ef4444
  );

  color:white;

  cursor:pointer;

  font-weight:700;

  transition:0.3s ease;

  box-shadow:
  0 10px 20px rgba(239,68,68,0.15);

}

.logout-btn:hover{

  transform:translateY(-2px);

}

/* ================= PROFILE ================= */

.profile{

  padding:25px 12px;

  text-align:center;

  border-bottom:1px solid rgba(148,163,184,0.12);

}

.avatar{

  width:100px;
  height:100px;

  border-radius:50%;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  display:flex;

  justify-content:center;

  align-items:center;

  margin:auto;

  font-size:38px;

  font-weight:800;

  margin-bottom:18px;

  color:white;

  box-shadow:
  0 12px 28px rgba(16,185,129,0.18);

}

.profile h3{

  margin-bottom:6px;

  color:var(--text);

  font-size:22px;

  font-weight:700;

  letter-spacing:-0.5px;

}

.profile p{

  color:var(--gray);

  font-size:14px;

  word-break:break-word;

  font-weight:500;

}

.status{

  margin-top:15px;

  display:inline-flex;

  align-items:center;

  gap:8px;

  background:
  rgba(16,185,129,0.10);

  color:#047857;

  padding:10px 16px;

  border-radius:40px;

  font-size:13px;

  font-weight:600;

  border:1px solid rgba(16,185,129,0.12);

}

.status-dot{

  width:9px;
  height:9px;

  border-radius:50%;

  background:#10b981;

  box-shadow:
  0 0 10px rgba(16,185,129,0.45);

}

/* ================= SEARCH ================= */

.search-box{

  padding:18px;

}

.search-box input{

  width:100%;

  padding:14px 15px;

  border:none;

  border-radius:18px;

  background:
  rgba(255,255,255,0.78);

  border:1px solid rgba(148,163,184,0.14);

  color:#0f172a;

  outline:none;

  font-size:15px;

  font-weight:500;

  box-shadow:
  inset 2px 2px 5px rgba(0,0,0,0.02),
  inset -2px -2px 5px rgba(255,255,255,0.7);

}

.search-box input::placeholder{

  color:#64748b;

}

/* ================= USERS ================= */

.users-list{

  flex:1;

  overflow-y:auto;

  padding:18px;

}

.users-title{

  color:var(--gray);

  margin-bottom:15px;

  font-size:13px;

  font-weight:700;

  letter-spacing:1px;

  text-transform:uppercase;

}

.user{

  background:
  rgba(255,255,255,0.55);

  backdrop-filter:var(--blur);

  padding:5px;

  border-radius:22px;

  margin-bottom:14px;

  display:flex;

  align-items:center;

  gap:14px;

  transition:0.3s ease;

  cursor:pointer;

  border:1px solid rgba(148,163,184,0.15);

  box-shadow:
  0 6px 16px rgba(15,23,42,0.05);

}

.user:hover{

  transform:translateY(-3px);

  background:
  rgba(255,255,255,0.78);

}

.user-avatar{

  width:52px;
  height:52px;

  border-radius:50%;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  display:flex;

  justify-content:center;

  align-items:center;

  font-weight:700;

  font-size:18px;

  color:white;

  box-shadow:
  0 8px 18px rgba(16,185,129,0.16);

}

.user-details{

  flex:1;

}

.user-details h4{

  margin-bottom:4px;

  font-size:15px;

  color:var(--text);

  font-weight:700;

}

.user-details p{

  color:var(--gray);

  font-size:12px;

  font-weight:500;

}

.online-dot{

  width:11px;
  height:11px;

  background:#10b981;

  border-radius:50%;

  box-shadow:
  0 0 10px rgba(16,185,129,0.45);

}

/* ================= CHAT ================= */

.chat-section{
  flex:1;
  display:flex;
  flex-direction:column;
  height:100%;
  min-height:0;
  overflow:hidden;
}


.chat-header{

  background:
  rgba(240,248,255,0.62);

  backdrop-filter:var(--blur);

  padding:24px;

  border-bottom:1px solid rgba(148,163,184,0.12);

  display:flex;

  justify-content:space-between;

  align-items:center;

  flex-wrap:wrap;

  gap:12px;

}

.chat-title h1{

  font-size:30px;

  font-weight:800;

  letter-spacing:-1px;

  color:var(--text);

}

.chat-title p{

  color:var(--gray);

  margin-top:6px;

  font-size:14px;

  font-weight:500;

}

.chat-actions{

  display:flex;

  gap:10px;

}

.header-btn{

  background:
  rgba(255,255,255,0.75);

  border:none;

  color:var(--primary);

  padding:12px 18px;

  border-radius:16px;

  cursor:pointer;

  font-weight:700;

  transition:0.3s ease;

  border:1px solid rgba(148,163,184,0.12);

  box-shadow:
  0 4px 12px rgba(15,23,42,0.04);

}

.header-btn:hover{

  transform:translateY(-2px);

}

/* ================= MESSAGES ================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:18px;
  scroll-behavior:smooth;
  min-height:0;
}

.chat-input-area{
  flex-shrink:0;
  position:sticky;
  bottom:0;
  z-index:10;
}
.message{

  max-width:75%;

  padding:16px 18px;

  border-radius:24px;

  animation:fadeIn 0.2s ease;

  position:relative;

  word-wrap:break-word;

}

@keyframes fadeIn{

  from{

    opacity:0;

    transform:translateY(10px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}

.sent{

  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  color:white;

  border-bottom-right-radius:8px;

  box-shadow:
  0 10px 24px rgba(16,185,129,0.16);

}

.received{

  align-self:flex-start;

  background:
  rgba(255,255,255,0.68);

  border-bottom-left-radius:8px;

  border:1px solid rgba(148,163,184,0.15);

  box-shadow:
  0 6px 18px rgba(15,23,42,0.04);

}

.message-name{

  font-size:13px;

  color:#dbeafe;

  margin-bottom:7px;

  font-weight:700;

}

.received .message-name{

  color:#0f766e;

}

.message-text{

  font-size:15px;

  line-height:1.7;

  font-weight:500;

}

.message-time{

  font-size:11px;

  opacity:0.75;

  margin-top:10px;

  text-align:right;

  font-weight:600;

}

.typing{

  padding:0 24px 12px;

  color:#475569;

  font-size:13px;

  font-weight:600;

}

/* ================= INPUT ================= */

.chat-input-area{

  padding:22px;

  background:
  rgba(240,248,255,0.60);

  backdrop-filter:var(--blur);

  border-top:1px solid rgba(148,163,184,0.12);

}

.input-wrapper{

  display:flex;

  gap:12px;

  align-items:center;

}

.chat-input-area input{

  flex:1;

  padding:17px 20px;

  border:none;

  border-radius:22px;

  background:
  rgba(255,255,255,0.78);

  border:1px solid rgba(148,163,184,0.14);

  color:#0f172a;

  outline:none;

  font-size:15px;

  font-weight:500;

  box-shadow:
  inset 2px 2px 5px rgba(0,0,0,0.02),
  inset -2px -2px 5px rgba(255,255,255,0.7);

}

.chat-input-area input::placeholder{

  color:#64748b;

}

.send-btn{

  padding:16px 24px;

  border:none;

  border-radius:20px;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  color:white;

  cursor:pointer;

  font-weight:700;

  transition:0.3s ease;

  box-shadow:
  0 10px 22px rgba(16,185,129,0.18);

}

.send-btn:hover{

  transform:translateY(-2px);

}


/* ================= MEDIA INPUT ================= */

.icon-btn{

  width:48px;
  height:48px;

  border:none;

  border-radius:16px;

  background:
  rgba(255,255,255,0.75);

  backdrop-filter:var(--blur);

  border:1px solid rgba(148,163,184,0.14);

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  font-size:22px;

  transition:0.25s ease;

  color:var(--primary);

  box-shadow:
  0 4px 12px rgba(15,23,42,0.05);

}

.icon-btn:hover{

  transform:translateY(-2px);

  background:white;

}

/* ================= EMOJI PICKER ================= */

.emoji-picker{

  position:absolute;

  bottom:95px;

  right:25px;

  width:240px;

  padding:15px;

  border-radius:22px;

  background:
  rgba(255,255,255,0.82);

  backdrop-filter:var(--blur);

  border:1px solid rgba(148,163,184,0.14);

  box-shadow:
  0 10px 30px rgba(15,23,42,0.12);

  display:none;

  flex-wrap:wrap;

  gap:12px;

  z-index:999;

}

.emoji-picker span{

  font-size:24px;

  cursor:pointer;

  transition:0.2s ease;

}

.emoji-picker span:hover{

  transform:scale(1.2);

}

/* ================= PREVIEW ================= */

.preview-container{

  display:flex;

  gap:12px;

  flex-wrap:wrap;

  margin-bottom:14px;

}

.preview-item{

  width:90px;
  height:90px;

  border-radius:18px;

  overflow:hidden;

  position:relative;

  background:
  rgba(255,255,255,0.75);

  border:1px solid rgba(148,163,184,0.12);

  box-shadow:
  0 6px 16px rgba(15,23,42,0.08);

}

.preview-item img,
.preview-item video{

  width:100%;
  height:100%;

  object-fit:cover;

}

.preview-item audio{

  width:100%;

  position:absolute;

  bottom:0;

}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .icon-btn{

    width:42px;
    height:42px;

    font-size:18px;

  }

}

/* ================= EMPTY ================= */

.empty-chat{

  margin:auto;

  text-align:center;

  color:#475569;

  line-height:1.9;

  font-weight:600;

  font-size:16px;

}

/* ================= SCROLL ================= */

::-webkit-scrollbar{

  width:6px;

}

::-webkit-scrollbar-thumb{

  background:#94a3b8;

  border-radius:10px;

}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

  .sidebar{

    width:300px;

  }

}

@media(max-width:900px){

  .sidebar{

    position:fixed;

    left:-100%;

    top:0;

    z-index:998;

    height:100%;

  }

  .mobile-menu-btn{

    display:block;

  }

  .chat-section{

    width:100%;

  }

}

@media(max-width:700px){

  .chat-header{

    padding:18px;

    padding-left:75px;

  }

  .chat-title h1{

    font-size:22px;

  }

  .messages{

    padding:16px;

  }

  .message{

    max-width:92%;

    padding:15px;

  }

  .chat-input-area{

    padding:15px;

  }

  .input-wrapper{

    gap:8px;

  }

  .chat-input-area input{

    padding:15px;

    font-size:14px;

  }

  .send-btn{

    padding:15px 18px;

  }

}

@media(max-width:480px){

  .sidebar{

    width:100%;

  }

  .profile{

    padding-top:80px;

  }

  .chat-title h1{

    font-size:20px;

  }

  .logo{

    font-size:24px;

  }

  .header-btn{

    padding:10px 14px;

    font-size:13px;

  }

}

/* ================= MOBILE MENU FIX ================= */
/* ================= MOBILE MENU FIX ================= */

.mobile-menu-btn{
  display:none;
}

@media(max-width:900px){

  .mobile-menu-btn{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    height:100%;
    z-index:998;
    transition:left 0.3s ease;
  }

  .sidebar.active{
    left:0;
  }

}

/* show only on small screens */
@media(max-width:900px){

  .mobile-menu-btn{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    height:100%;
    z-index:998;
    transition:left 0.3s ease;
  }

  .sidebar.active{
    left:0;
  }

}

@media(max-width:900px){

  .profile{
    padding:10px 5px;
  }

  .avatar{
    width:55px;
    height:55px;
    font-size: 18px;
    margin-bottom:6px;
  }

  .profile h3{
    font-size:15px;
  }

  .profile p{
    font-size:12px;
  }

  .status{
    padding:8px 12px;
    font-size:12px;
  }

}

@media(max-width:700px){

  .chat-input-area{
    padding-bottom:calc(15px + env(safe-area-inset-bottom));
  }

}

</style>
</head>

<body>

<!-- MOBILE BUTTON -->

<button class="mobile-menu-btn" id="menuBtn">
  ☰
</button>

<div class="chat-app">

  <!-- ================= SIDEBAR ================= -->

  <div class="sidebar" id="sidebar">

    <div class="sidebar-header">

      <div class="logo">
        Let's Chat
      </div>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>

    <!-- PROFILE -->

    <div class="profile">

      <div class="avatar" id="avatar">
        U
      </div>

      <h3 id="username">
        Loading...
      </h3>

      <p id="email">
        Loading...
      </p>

      <div class="status">
        <div class="status-dot"></div>
        Online
      </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search users..."
      />

    </div>

    <!-- USERS -->

    <div class="users-list">

      <div class="users-title">
        Users
      </div>

      <div id="usersContainer"></div>

    </div>

  </div>

  <!-- ================= CHAT SECTION ================= -->

  <div class="chat-section">

    <div class="chat-header">

  <div class="chat-title">

    <h1>Global Chat Room</h1>

    <p>
      Seeker Realtime Chat Application
    </p>

  </div>

  <div class="chat-actions">

    <button class="header-btn" id="clearBtn">
      Clear Input
    </button>

  </div>

</div>
    <!-- MESSAGES -->

    <div class="messages" id="messages">

      <div class="empty-chat">
        No messages yet 🚀<br/>
        Start chatting now
      </div>

    </div>

    <!-- TYPING -->

    <div class="typing" id="typingText"></div>

    <!-- INPUT -->

    <!-- INPUT -->

<div class="chat-input-area">

  <!-- PREVIEW AREA -->
  <div id="previewContainer" class="preview-container"></div>

  <!-- EMOJI PICKER -->
  <div class="emoji-picker" id="emojiPicker">

    <span>😀</span>
    <span>😂</span>
    <span>😍</span>
    <span>🔥</span>
    <span>❤️</span>
    <span>👍</span>
    <span>😭</span>
    <span>🎉</span>
    <span>😎</span>
    <span>🙏</span>

  </div>

  <div class="input-wrapper">

    <!-- ATTACH -->
    <label for="fileInput" class="icon-btn">
      📎
    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/*,video/*,audio/*"
      multiple
      hidden
    />

    <!-- MESSAGE -->
    <input
      type="text"
      id="messageInput"
      placeholder="Type your message..."
    />

    <!-- EMOJI -->
    <button class="icon-btn" id="emojiBtn">
      😊
    </button>

    <!-- VOICE -->
    <button class="icon-btn" id="micBtn">
      🎤
    </button>

    <!-- SEND -->
    <button class="send-btn" id="sendBtn">
      Send
    </button>

  </div>

</div>
  </div>

</div>

<script type="module">

// ================= FIREBASE =================

import { auth, db } from "./firebase.js";
import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const storage = getStorage();

import {
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc,
  updateDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ================= ELEMENTS =================

const username = document.getElementById("username");
const email = document.getElementById("email");
const avatar = document.getElementById("avatar");
const usersContainer = document.getElementById("usersContainer");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const logoutBtn = document.getElementById("logoutBtn");
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
const typingText = document.getElementById("typingText");
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const fileInput = document.getElementById("fileInput");
const previewContainer = document.getElementById("previewContainer");
const emojiBtn = document.getElementById("emojiBtn");
const emojiPicker = document.getElementById("emojiPicker");
const micBtn = document.getElementById("micBtn");

// ================= DM STATE =================

function getChatId(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}

let currentUser = null;
let activeDMUser = null;
let activeChatId = null;
let unsubscribeMessages = null;

// ================= MOBILE MENU =================

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("active");
});

// ================= CLEAR =================

clearBtn?.addEventListener("click", () => {
  messageInput.value = "";
  previewContainer.innerHTML = "";
  fileInput.value = "";
});

// ================= INITIALS =================

function getInitials(name) {
  if (!name) return "U";
  const parts = name.trim().split(" ");
  return parts.length === 1
    ? parts[0][0].toUpperCase()
    : (parts[0][0] + parts[1][0]).toUpperCase();
}

// ================= AUTH =================

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  username.innerText = user.displayName || "User";
  email.innerText = user.email;
  avatar.innerText = getInitials(user.displayName);

  await setDoc(doc(db, "users", user.uid), {
    username: user.displayName || "User",
    email: user.email,
    online: true
  }, { merge: true });

});

// ================= EMOJI =================

emojiBtn.addEventListener("click", () => {
  emojiPicker.style.display =
    emojiPicker.style.display === "flex" ? "none" : "flex";
});

document.querySelectorAll(".emoji-picker span").forEach(e => {
  e.addEventListener("click", () => {
    messageInput.value += e.textContent;
  });
});

// ================= FILE PREVIEW =================

fileInput.addEventListener("change", (e) => {

  previewContainer.innerHTML = "";

  Array.from(e.target.files).forEach(file => {

    const reader = new FileReader();

    reader.onload = (event) => {

      const div = document.createElement("div");
      div.classList.add("preview-item");

      if (file.type.startsWith("image/")) {
        div.innerHTML = `<img src="${event.target.result}">`;
      } else if (file.type.startsWith("video/")) {
        div.innerHTML = `<video controls src="${event.target.result}"></video>`;
      } else if (file.type.startsWith("audio/")) {
        div.innerHTML = `<audio controls src="${event.target.result}"></audio>`;
      }

      previewContainer.appendChild(div);
    };

    reader.readAsDataURL(file);
  });
});

// ================= VOICE =================

let mediaRecorder;
let audioChunks = [];

micBtn.addEventListener("click", async () => {

  if (!mediaRecorder || mediaRecorder.state === "inactive") {

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.start();
    micBtn.innerHTML = "⏹️";

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const url = URL.createObjectURL(blob);

      const div = document.createElement("div");
      div.innerHTML = `<audio controls src="${url}"></audio>`;
      previewContainer.appendChild(div);

      micBtn.innerHTML = "🎤";
    };

  } else {
    mediaRecorder.stop();
  }
});

// ================= OPEN DM =================

function openDM(userId, name) {

  if (!currentUser) return;

  // prevent chatting with yourself
  if (userId === currentUser.uid) {
    alert("You cannot message yourself");
    return;
  }

  activeDMUser = userId;

  activeChatId = getChatId(currentUser.uid, userId);

  document.querySelector(".chat-title h1").innerText = name;

  messageInput.disabled = false;
  messageInput.placeholder = `Message ${name}...`;

  listenToDM(activeChatId);

  // close mobile sidebar
  sidebar.classList.remove("active");
}
// ================= LISTEN DM =================

function listenToDM(chatId) {

  if (!chatId) return;

  // remove old realtime listener
  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  const dmQuery = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(dmQuery, (snapshot) => {

    messages.innerHTML = "";

    // EMPTY CHAT
    if (snapshot.empty) {

      messages.innerHTML = `
        <div class="empty-chat">
          No messages yet 🚀<br/>
          Start chatting now
        </div>
      `;

      return;
    }

    snapshot.forEach((docSnap) => {

      const data = docSnap.data();

      const isMe = data.uid === currentUser.uid;

      const div = document.createElement("div");

      div.classList.add(
        "message",
        isMe ? "sent" : "received"
      );

      let content = "";

      // TEXT
      if (data.type === "text") {

        content = `
          <div class="message-text">
            ${data.text}
          </div>
        `;

      }

      // IMAGE
      else if (data.type === "image") {

        content = `
          <img
            src="${data.fileURL}"
            style="
              max-width:260px;
              border-radius:12px;
            "
          >
        `;

      }

      // VIDEO
      else if (data.type === "video") {

        content = `
          <video
            controls
            src="${data.fileURL}"
            style="
              max-width:260px;
              border-radius:12px;
            "
          ></video>
        `;

      }

      // AUDIO
      else if (data.type === "audio") {

        content = `
          <audio controls src="${data.fileURL}"></audio>
        `;

      }

      div.innerHTML = `
        <div class="message-name">
          ${data.username}
        </div>

        ${content}
      `;

      messages.appendChild(div);
    });

    messages.scrollTop = messages.scrollHeight;
  });
}
// ================= SEND MESSAGE =================

async function sendMessage() {

  if (!currentUser) return;

if (!activeChatId) {
  alert("Select a user to start chatting");
  return;
}

  const text = messageInput.value.trim();
  const files = fileInput.files;

  if (!text && files.length === 0) return;

  // TEXT
  if (text) {

    await addDoc(
      collection(db, "chats", activeChatId, "messages"),
      {
        text,
        uid: currentUser.uid,
        username: currentUser.displayName || "User",
        type: "text",
        createdAt: serverTimestamp()
      }
    );
  }

  // FILES
  for (const file of files) {

    const type =
      file.type.startsWith("image/")
        ? "image"
        : file.type.startsWith("video/")
        ? "video"
        : file.type.startsWith("audio/")
        ? "audio"
        : "file";

    const storageRef = ref(storage, `chatFiles/${Date.now()}_${file.name}`);

    await uploadBytes(storageRef, file);

    const url = await getDownloadURL(storageRef);

    await addDoc(
      collection(db, "chats", activeChatId, "messages"),
      {
        fileURL: url,
        type,
        uid: currentUser.uid,
        username: currentUser.displayName || "User",
        createdAt: serverTimestamp()
      }
    );
  }

  messageInput.value = "";
  fileInput.value = "";
  previewContainer.innerHTML = "";
}

// ================= SEND EVENTS =================

sendBtn.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

// ================= USERS =================

let allUsers = [];

onSnapshot(collection(db, "users"), (snapshot) => {

  allUsers = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

  usersContainer.innerHTML = "";

  allUsers
  .filter(user => user.id !== currentUser?.uid)
  .forEach(user => {
    
    const div = document.createElement("div");
    div.classList.add("user");

    div.onclick = () => openDM(user.id, user.username);

    div.innerHTML = `
      <div class="user-avatar">${getInitials(user.username)}</div>
      <div class="user-details">
        <h4>${user.username}</h4>
        <p>${user.online ? "Online" : "Offline"}</p>
      </div>
    `;

    usersContainer.appendChild(div);
  });

});

// ================= LOGOUT =================

logoutBtn.addEventListener("click", async () => {

  if (currentUser) {
    await updateDoc(doc(db, "users", currentUser.uid), {
      online: false
    });
  }

  await signOut(auth);
  window.location.href = "login.html";
});
