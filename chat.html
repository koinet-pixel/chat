<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Firebase Chat App</title>

  <style>


@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
}

:root{

  --bg:
  linear-gradient(
    135deg,
    #dfe9f3,
    #c7d8ee,
    #d8ede4
  );

  --sidebar:
  rgba(240,248,255,0.72);

  --card:
  rgba(255,255,255,0.60);

  --primary:#3b82f6;

  --primary-hover:#2563eb;

  --secondary:#10b981;

  --text:#0f172a;

  --gray:#475569;

  --danger:#ef4444;

  --success:#16a34a;

  --border:
  rgba(148,163,184,0.22);

  --shadow:
  0 10px 30px rgba(15,23,42,0.10);

  --blur:blur(14px);

}

body{

  background:var(--bg);

  color:var(--text);

  height:100vh;

  overflow:hidden;

  position:relative;

}

/* ================= BACKGROUND EFFECTS ================= */

body::before{

  content:"";

  position:fixed;

  width:450px;
  height:450px;

  border-radius:50%;

  background:
  rgba(59,130,246,0.12);

  top:-160px;
  right:-160px;

  filter:blur(90px);

  z-index:-1;
}

body::after{

  content:"";

  position:fixed;

  width:420px;
  height:420px;

  border-radius:50%;

  background:
  rgba(16,185,129,0.10);

  bottom:-160px;
  left:-140px;

  filter:blur(90px);

  z-index:-1;
}

.chat-app{
  display:flex;
  width:100%;
  height:100dvh;
  overflow:hidden;
}
/* ================= MOBILE MENU ================= */

.mobile-menu-btn{

  display:none;

  position:fixed;

  top:18px;
  left:18px;

  z-index:999;

  width:48px;
  height:48px;

  border:none;

  border-radius:16px;

  background:
  rgba(255,255,255,0.82);

  backdrop-filter:var(--blur);

  border:1px solid var(--border);

  color:var(--primary);

  font-size:22px;

  cursor:pointer;

  box-shadow:var(--shadow);

}

/* ================= SIDEBAR ================= */

.sidebar{

  width:340px;

  background:
  rgba(240,248,255,0.66);

  backdrop-filter:var(--blur);

  border-right:1px solid rgba(148,163,184,0.18);

  display:flex;

  flex-direction:column;

  transition:0.35s ease;

  box-shadow:
  0 10px 35px rgba(15,23,42,0.08);

}

.sidebar.active{

  left:0;

}

.sidebar-header{

  padding:24px 22px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  border-bottom:1px solid rgba(148,163,184,0.12);

}

.logo{

  font-size:28px;

  font-weight:800;

  letter-spacing:-1px;

  color:var(--primary);

}

.logout-btn{

  padding:12px 16px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #fb7185,
    #ef4444
  );

  color:white;

  cursor:pointer;

  font-weight:700;

  transition:0.3s ease;

  box-shadow:
  0 10px 20px rgba(239,68,68,0.15);

}

.logout-btn:hover{

  transform:translateY(-2px);

}

/* ================= PROFILE ================= */

.profile{

  padding:25px 12px;

  text-align:center;

  border-bottom:1px solid rgba(148,163,184,0.12);

}

.avatar{

  width:100px;
  height:100px;

  border-radius:50%;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  display:flex;

  justify-content:center;

  align-items:center;

  margin:auto;

  font-size:38px;

  font-weight:800;

  margin-bottom:18px;

  color:white;

  box-shadow:
  0 12px 28px rgba(16,185,129,0.18);

}

.profile h3{

  margin-bottom:6px;

  color:var(--text);

  font-size:22px;

  font-weight:700;

  letter-spacing:-0.5px;

}

.profile p{

  color:var(--gray);

  font-size:14px;

  word-break:break-word;

  font-weight:500;

}

.status{

  margin-top:15px;

  display:inline-flex;

  align-items:center;

  gap:8px;

  background:
  rgba(16,185,129,0.10);

  color:#047857;

  padding:10px 16px;

  border-radius:40px;

  font-size:13px;

  font-weight:600;

  border:1px solid rgba(16,185,129,0.12);

}

.status-dot{

  width:9px;
  height:9px;

  border-radius:50%;

  background:#10b981;

  box-shadow:
  0 0 10px rgba(16,185,129,0.45);

}

/* ================= SEARCH ================= */

.search-box{

  padding:18px;

}

.search-box input{

  width:100%;

  padding:14px 15px;

  border:none;

  border-radius:18px;

  background:
  rgba(255,255,255,0.78);

  border:1px solid rgba(148,163,184,0.14);

  color:#0f172a;

  outline:none;

  font-size:15px;

  font-weight:500;

  box-shadow:
  inset 2px 2px 5px rgba(0,0,0,0.02),
  inset -2px -2px 5px rgba(255,255,255,0.7);

}

.search-box input::placeholder{

  color:#64748b;

}

/* ================= USERS ================= */

.users-list{

  flex:1;

  overflow-y:auto;

  padding:18px;

}

.users-title{

  color:var(--gray);

  margin-bottom:15px;

  font-size:13px;

  font-weight:700;

  letter-spacing:1px;

  text-transform:uppercase;

}

.user{

  background:
  rgba(255,255,255,0.55);

  backdrop-filter:var(--blur);

  padding:5px;

  border-radius:22px;

  margin-bottom:14px;

  display:flex;

  align-items:center;

  gap:14px;

  transition:0.3s ease;

  cursor:pointer;

  border:1px solid rgba(148,163,184,0.15);

  box-shadow:
  0 6px 16px rgba(15,23,42,0.05);

}

.user:hover{

  transform:translateY(-3px);

  background:
  rgba(255,255,255,0.78);

}

.user-avatar{

  width:52px;
  height:52px;

  border-radius:50%;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  display:flex;

  justify-content:center;

  align-items:center;

  font-weight:700;

  font-size:18px;

  color:white;

  box-shadow:
  0 8px 18px rgba(16,185,129,0.16);

}

.user-details{

  flex:1;

}

.user-details h4{

  margin-bottom:4px;

  font-size:15px;

  color:var(--text);

  font-weight:700;

}

.user-details p{

  color:var(--gray);

  font-size:12px;

  font-weight:500;

}

.online-dot{

  width:11px;
  height:11px;

  background:#10b981;

  border-radius:50%;

  box-shadow:
  0 0 10px rgba(16,185,129,0.45);

}

/* ================= CHAT ================= */

.chat-section{
  flex:1;
  display:flex;
  flex-direction:column;
  height:100%;
  min-height:0;
  overflow:hidden;
}


.chat-header{

  background:
  rgba(240,248,255,0.62);

  backdrop-filter:var(--blur);

  padding:24px;

  border-bottom:1px solid rgba(148,163,184,0.12);

  display:flex;

  justify-content:space-between;

  align-items:center;

  flex-wrap:wrap;

  gap:12px;

}

.chat-title h1{

  font-size:30px;

  font-weight:800;

  letter-spacing:-1px;

  color:var(--text);

}

.chat-title p{

  color:var(--gray);

  margin-top:6px;

  font-size:14px;

  font-weight:500;

}

.chat-actions{

  display:flex;

  gap:10px;

}

.header-btn{

  background:
  rgba(255,255,255,0.75);

  border:none;

  color:var(--primary);

  padding:12px 18px;

  border-radius:16px;

  cursor:pointer;

  font-weight:700;

  transition:0.3s ease;

  border:1px solid rgba(148,163,184,0.12);

  box-shadow:
  0 4px 12px rgba(15,23,42,0.04);

}

.header-btn:hover{

  transform:translateY(-2px);

}

/* ================= MESSAGES ================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:18px;
  scroll-behavior:smooth;
  min-height:0;
}

.chat-input-area{
  flex-shrink:0;
  position:sticky;
  bottom:0;
  z-index:10;
}
.message{

  max-width:75%;

  padding:16px 18px;

  border-radius:24px;

  animation:fadeIn 0.2s ease;

  position:relative;

  word-wrap:break-word;

}

@keyframes fadeIn{

  from{

    opacity:0;

    transform:translateY(10px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}

.sent{

  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  color:white;

  border-bottom-right-radius:8px;

  box-shadow:
  0 10px 24px rgba(16,185,129,0.16);

}

.received{

  align-self:flex-start;

  background:
  rgba(255,255,255,0.68);

  border-bottom-left-radius:8px;

  border:1px solid rgba(148,163,184,0.15);

  box-shadow:
  0 6px 18px rgba(15,23,42,0.04);

}

.message-name{

  font-size:13px;

  color:#dbeafe;

  margin-bottom:7px;

  font-weight:700;

}

.received .message-name{

  color:#0f766e;

}

.message-text{

  font-size:15px;

  line-height:1.7;

  font-weight:500;

}

.message-time{

  font-size:11px;

  opacity:0.75;

  margin-top:10px;

  text-align:right;

  font-weight:600;

}

.typing{

  padding:0 24px 12px;

  color:#475569;

  font-size:13px;

  font-weight:600;

}

/* ================= INPUT ================= */

.chat-input-area{

  padding:22px;

  background:
  rgba(240,248,255,0.60);

  backdrop-filter:var(--blur);

  border-top:1px solid rgba(148,163,184,0.12);

}

.input-wrapper{

  display:flex;

  gap:12px;

  align-items:center;

}

.chat-input-area input{

  flex:1;

  padding:17px 20px;

  border:none;

  border-radius:22px;

  background:
  rgba(255,255,255,0.78);

  border:1px solid rgba(148,163,184,0.14);

  color:#0f172a;

  outline:none;

  font-size:15px;

  font-weight:500;

  box-shadow:
  inset 2px 2px 5px rgba(0,0,0,0.02),
  inset -2px -2px 5px rgba(255,255,255,0.7);

}

.chat-input-area input::placeholder{

  color:#64748b;

}

.send-btn{

  padding:16px 24px;

  border:none;

  border-radius:20px;

  background:
  linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  color:white;

  cursor:pointer;

  font-weight:700;

  transition:0.3s ease;

  box-shadow:
  0 10px 22px rgba(16,185,129,0.18);

}

.send-btn:hover{

  transform:translateY(-2px);

}

/* ================= EMPTY ================= */

.empty-chat{

  margin:auto;

  text-align:center;

  color:#475569;

  line-height:1.9;

  font-weight:600;

  font-size:16px;

}

/* ================= SCROLL ================= */

::-webkit-scrollbar{

  width:6px;

}

::-webkit-scrollbar-thumb{

  background:#94a3b8;

  border-radius:10px;

}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

  .sidebar{

    width:300px;

  }

}

@media(max-width:900px){

  .sidebar{

    position:fixed;

    left:-100%;

    top:0;

    z-index:998;

    height:100%;

  }

  .mobile-menu-btn{

    display:block;

  }

  .chat-section{

    width:100%;

  }

}

@media(max-width:700px){

  .chat-header{

    padding:18px;

    padding-left:75px;

  }

  .chat-title h1{

    font-size:22px;

  }

  .messages{

    padding:16px;

  }

  .message{

    max-width:92%;

    padding:15px;

  }

  .chat-input-area{

    padding:15px;

  }

  .input-wrapper{

    gap:8px;

  }

  .chat-input-area input{

    padding:15px;

    font-size:14px;

  }

  .send-btn{

    padding:15px 18px;

  }

}

@media(max-width:480px){

  .sidebar{

    width:100%;

  }

  .profile{

    padding-top:80px;

  }

  .chat-title h1{

    font-size:20px;

  }

  .logo{

    font-size:24px;

  }

  .header-btn{

    padding:10px 14px;

    font-size:13px;

  }

}

/* ================= MOBILE MENU FIX ================= */
/* ================= MOBILE MENU FIX ================= */

.mobile-menu-btn{
  display:none;
}

@media(max-width:900px){

  .mobile-menu-btn{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    height:100%;
    z-index:998;
    transition:left 0.3s ease;
  }

  .sidebar.active{
    left:0;
  }

}

/* show only on small screens */
@media(max-width:900px){

  .mobile-menu-btn{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    height:100%;
    z-index:998;
    transition:left 0.3s ease;
  }

  .sidebar.active{
    left:0;
  }

}

@media(max-width:900px){

  .profile{
    padding:10px 5px;
  }

  .avatar{
    width:55px;
    height:55px;
    font-size: 18px;
    margin-bottom:6px;
  }

  .profile h3{
    font-size:15px;
  }

  .profile p{
    font-size:12px;
  }

  .status{
    padding:8px 12px;
    font-size:12px;
  }

}

@media(max-width:700px){

  .chat-input-area{
    padding-bottom:calc(15px + env(safe-area-inset-bottom));
  }

}

</style>
</head>

<body>

<!-- MOBILE BUTTON -->

<button class="mobile-menu-btn" id="menuBtn">
  ☰
</button>

<div class="chat-app">

  <!-- ================= SIDEBAR ================= -->

  <div class="sidebar" id="sidebar">

    <div class="sidebar-header">

      <div class="logo">
        Let's Chat
      </div>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>

    <!-- PROFILE -->

    <div class="profile">

      <div class="avatar" id="avatar">
        U
      </div>

      <h3 id="username">
        Loading...
      </h3>

      <p id="email">
        Loading...
      </p>

      <div class="status">
        <div class="status-dot"></div>
        Online
      </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search users..."
      />

    </div>

    <!-- USERS -->

    <div class="users-list">

      <div class="users-title">
        Users
      </div>

      <div id="usersContainer"></div>

    </div>

  </div>

  <!-- ================= CHAT SECTION ================= -->

  <div class="chat-section">

    <div class="chat-header">

      <div class="chat-title">

        <h1>Global Chat Room</h1>

        <p>
          Seeker Realtime Chat Application
        </p>

      </div>


    </div>

    <!-- MESSAGES -->

    <div class="messages" id="messages">

      <div class="empty-chat">
        No messages yet 🚀<br/>
        Start chatting now
      </div>

    </div>

    <!-- TYPING -->

    <div class="typing" id="typingText"></div>

    <!-- INPUT -->

    <div class="chat-input-area">

      <div class="input-wrapper">

        <input
          type="text"
          id="messageInput"
          placeholder="Type your message..."
        />

        <button class="send-btn" id="sendBtn">
          Send
        </button>

      </div>

    </div>

  </div>

</div>

<script type="module">

  // FIREBASE
  import { auth, db } from "./firebase.js";

  import {
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp,
    doc,
    setDoc,
    updateDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import {
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ELEMENTS
  const username = document.getElementById("username");
  const email = document.getElementById("email");
  const avatar = document.getElementById("avatar");
  const usersContainer = document.getElementById("usersContainer");
  const messages = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const searchInput = document.getElementById("searchInput");
  const clearBtn = document.getElementById("clearBtn") || null;
  const typingText = document.getElementById("typingText");
  const menuBtn = document.getElementById("menuBtn");
  const sidebar = document.getElementById("sidebar");

  // ================= MOBILE MENU =================
  menuBtn.addEventListener("click", () => {
    sidebar.classList.toggle("active");
  });

  function getInitials(name) {
    if (!name) return "U";
    const names = name.trim().split(" ");
    if (names.length === 1) return names[0][0].toUpperCase();
    return (names[0][0] + names[1][0]).toUpperCase();
  }

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = user;

    username.innerText = user.displayName || "User";
    email.innerText = user.email;
    avatar.innerText = getInitials(user.displayName);

    await setDoc(
      doc(db, "users", user.uid),
      {
        username: user.displayName || "User",
        email: user.email,
        online: true
      },
      { merge: true }
    );

    window.addEventListener("beforeunload", async () => {
      await updateDoc(doc(db, "users", user.uid), {
        online: false
      });
    });
  });

  // ================= FIXED SEND MESSAGE =================
  async function sendMessage() {
    const text = messageInput.value.trim();

    if (!text || !currentUser) return;

    try {
      await addDoc(collection(db, "messages"), {
        text: text,
        uid: currentUser.uid,
        username: currentUser.displayName || "User",
        email: currentUser.email,
        createdAt: serverTimestamp()
      });

      messageInput.value = "";

      await deleteDoc(doc(db, "typing", currentUser.uid));

    } catch (error) {
      console.log(error);
      alert("Failed to send message");
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // ================= TYPING STATUS =================
  let typingTimeout;

messageInput.addEventListener("input", async () => {
  if (!currentUser) return;

  await setDoc(doc(db, "typing", currentUser.uid), {
    username: currentUser.displayName || "User",
    typing: true,
    timestamp: Date.now()
  });

  clearTimeout(typingTimeout);

  typingTimeout = setTimeout(async () => {
    await deleteDoc(doc(db, "typing", currentUser.uid));
  }, 1500);
});

  // ================= REAL-TIME MESSAGES =================
  const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));

  onSnapshot(q, (snapshot) => {
    messages.innerHTML = "";

    if (snapshot.empty) {
      messages.innerHTML = `
        <div class="empty-chat">
          No messages yet 🚀<br/>
          Start chatting now
        </div>
      `;
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();

      const div = document.createElement("div");

      const isCurrentUser =
        currentUser && data.uid === currentUser.uid;

      div.classList.add("message", isCurrentUser ? "sent" : "received");

      let time = "";
      if (data.createdAt) {
        time = new Date(
          data.createdAt.seconds * 1000
        ).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      div.innerHTML = `
        <div class="message-name">${data.username}</div>
        <div class="message-text">${data.text}</div>
        <div class="message-time">${time}</div>
      `;

      messages.appendChild(div);
    });

    messages.scrollTop = messages.scrollHeight;
  });

  // ================= USERS =================
  let allUsers = [];

  onSnapshot(collection(db, "users"), (snapshot) => {
    allUsers = [];

    snapshot.forEach((docSnap) => {
      allUsers.push({ id: docSnap.id, ...docSnap.data() });
    });

    displayUsers(allUsers);
  });

  function displayUsers(users) {
    usersContainer.innerHTML = "";

    users.forEach((user) => {
      const div = document.createElement("div");
      div.classList.add("user");

      div.innerHTML = `
        <div class="user-avatar">
          ${user.username ? user.username.charAt(0).toUpperCase() : "U"}
        </div>

        <div class="user-details">
          <h4>${user.username}</h4>
          <p>${user.online ? "Online" : "Offline"}</p>
        </div>

        ${user.online ? '<div class="online-dot"></div>' : ""}
      `;

      usersContainer.appendChild(div);
    });
  }

  // ================= TYPING BUBBLES =================
  let typingBubble = null;

  function removeTypingBubble() {
    if (typingBubble) {
      typingBubble.remove();
      typingBubble = null;
    }
  }

onSnapshot(collection(db, "typing"), (snapshot) => {

  let typingUsers = [];

  snapshot.forEach((docSnap) => {

    const data = docSnap.data();

    if (
      currentUser &&
      docSnap.id !== currentUser.uid &&
      data.timestamp &&
      Date.now() - data.timestamp < 5000
    ) {
      typingUsers.push(data.username);
    }

  });

  if (typingUsers.length > 0) {
    typingText.innerText = `${typingUsers.join(", ")} typing...`;
  } else {
    typingText.innerText = "";
  }

});

  // ================= SEARCH =================
  searchInput.addEventListener("input", () => {
    const value = searchInput.value.toLowerCase();

    const filteredUsers = allUsers.filter((user) => {
      return (
        (user.username || "").toLowerCase().includes(value) ||
        (user.email || "").toLowerCase().includes(value)
      );
    });

    displayUsers(filteredUsers);
  });

  // ================= LOGOUT =================
  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "login.html";
  });

</script>
</body>
